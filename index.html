    const c=getContact(contactId);if(!c){showToast('联系人不存在');return;}
    const cards=getClockCards(clockState.direction,contactId);
    if(cards.length===0){closeModal();showToast('该方向还没有可用查岗字卡');clockState.cardDir=clockState.direction;clockState.clockOwnerId=contactId;clockState.stage='cards';renderClockPage();return;}
    clockState.targetName=c.name;clockState.targetContactId=contactId;
    closeModal();startClockConnection();
}
function startClockConnection(){
    clockState.stage='connecting';clockState.connectionResult=null;renderClockPage();
    const t=setTimeout(()=>{const rand=Math.random();let result;if(rand<0.35)result='success';else if(rand<0.55)result='unstable';else if(rand<0.78)result='busy';else result='refused';clockState.connectionResult=result;renderClockPage();},2000);
    addClockTimer(t);
}
function renderClockConnecting(body){
    if(!clockState.connectionResult){body.innerHTML=`<div class="clock-connecting"><div class="clock-spinner"></div><div class="clock-connecting-text">正在连接对方中……</div><div class="clock-connecting-sub">目标：${escapeHtml(clockState.targetName)}</div></div>`;return;}
    const r=clockState.connectionResult;
    const map={success:{icon:'✅',text:'连接成功',cls:'success'},unstable:{icon:'📶',text:'链接不稳',cls:'unstable'},busy:{icon:'⏳',text:'对方正在忙',cls:'busy'},refused:{icon:'🚫',text:'对方拒绝连接',cls:'refused'}};
    const info=map[r];
    const canNext=(r==='success'||r==='unstable');
    body.innerHTML=`<div class="clock-result-box ${info.cls}"><div class="clock-result-icon">${info.icon}</div><div class="clock-result-text">${info.text}</div>${canNext?`<button class="btn-primary" style="margin-top:26px;padding:12px 40px;" onclick="clockStartDraw()">开始查询</button>`:`<button class="btn-outline" style="margin-top:26px;padding:12px 40px;color:#fff;border-color:rgba(255,255,255,.3);" onclick="clockBackHome()">返回</button>`}</div>`;
}
function clockBackHome(){
    clearClockTimers();
    clockState.stage='home';clockState.direction=null;clockState.connectionResult=null;
    clockState.firstCard=null;clockState.verifyCards=[];clockState.verifyStage=null;
    clockState.autoPickIdx=-1;clockState.retryCount=0;clockState.cardDir=null;clockState.clockOwnerId=null;
    renderClockPage();
}
function clockStartDraw(){
    const cards=getClockCards(clockState.direction,clockState.targetContactId);
    if(cards.length===0){showToast('该方向还没有可用查岗字卡');openClockCardSetting(clockState.direction);return;}
    clockState.stage='drawing';clockState.firstCard=null;clockState.verifyCards=[];
    clockState.verifyStage=null;clockState.autoPickIdx=-1;renderClockPage();
    const t=setTimeout(()=>{const pick=cards[Math.floor(Math.random()*cards.length)];clockState.firstCard=pick;renderClockPage();},1600);
    addClockTimer(t);
}
function renderClockShuffle(body,text){body.innerHTML=`<div class="clock-shuffle"><div class="clock-card-stack"><div class="clock-card-back"></div><div class="clock-card-back"></div><div class="clock-card-back"></div></div><div class="clock-shuffle-text">${escapeHtml(text||'正在洗牌……')}</div></div>`;}
function renderClockDrawing(body){
    if(!clockState.firstCard){renderClockShuffle(body,'正在洗牌……');return;}
    body.innerHTML=`<div class="clock-draw-area"><div class="clock-card-wrap"><div class="clock-card" id="clockResultCard">⭐</div></div><button class="btn-primary" style="padding:12px 40px;" id="clockRevealBtn" onclick="clockRevealCard()">点击查看</button></div>`;
}
function clockRevealCard(){
    const cardEl=document.getElementById('clockResultCard');
    if(cardEl&&clockState.firstCard){cardEl.classList.add('revealed');cardEl.innerHTML=`<div class="clock-card-content">${escapeHtml(clockState.firstCard.word)}</div>`;}
    const btn=document.getElementById('clockRevealBtn');if(btn)btn.style.display='none';
    const area=document.querySelector('.clock-draw-area');
    if(area&&!document.getElementById('clockBackBtn')){const backBtn=document.createElement('button');backBtn.id='clockBackBtn';backBtn.textContent='← 返回';backBtn.style.cssText='margin-top:18px;padding:10px 30px;border-radius:20px;border:1px solid rgba(255,255,255,.25);background:transparent;color:rgba(255,255,255,.7);font-size:14px;cursor:pointer;display:block;margin-left:auto;margin-right:auto;';backBtn.onclick=clockBackHome;area.appendChild(backBtn);}
    const t=setTimeout(()=>{showClockVerifyPrompt();},1000);
    addClockTimer(t);
}
function showClockVerifyPrompt(){
    const firstWord=clockState.firstCard?clockState.firstCard.word:'';
    showModal('🔍 二次验证',`<div class="clock-first-ref" style="margin-bottom:14px;">你这次抽到的牌：<b>${escapeHtml(firstWord)}</b></div><div style="text-align:center;padding:6px 0 8px;font-size:16px;font-weight:600;">是否进行二次验证？</div><div class="setting-sub" style="text-align:center;margin-bottom:6px;">二次验证由系统自动帮你抽牌</div><div class="modal-actions"><button class="btn-cancel" onclick="closeModal()">取消</button><button class="btn-confirm" onclick="clockStartVerify()">确认</button></div>`);
}
function clockStartVerify(){
    closeModal();
    const cards=getClockCards(clockState.direction,clockState.targetContactId);
    if(cards.length<3){showModal('提示','<div style="text-align:center;padding:12px 0 16px;">该方向的查岗字卡不足 3 张，无法进行二次验证</div><div class="modal-actions"><button class="btn-confirm" onclick="closeModal();clockBackHome();">知道了</button></div>');return;}
    if(!clockState.firstCard){showToast('数据异常，请重新查询');clockBackHome();return;}
    const others=cards.filter(x=>x.id!==clockState.firstCard.id);
    shuffleArray(others);
    const two=others.slice(0,2);
    const three=[clockState.firstCard,...two];
    shuffleArray(three);
    clockState.verifyCards=three;clockState.verifyStage=null;clockState.autoPickIdx=-1;clockState.stage='verify';
    renderClockPage();
    const t=setTimeout(()=>{
        clockState.verifyStage='pick';renderClockPage();
        const t2=setTimeout(()=>{if(!clockState.open||clockState.stage!=='verify'||!clockState.verifyCards.length)return;const idx=Math.floor(Math.random()*clockState.verifyCards.length);clockAutoPickVerifyCard(idx);},1500);
        addClockTimer(t2);
    },1600);
    addClockTimer(t);
}
function renderClockVerifyPick(body){
    const firstWord=clockState.firstCard?clockState.firstCard.word:'';
    let html='<div class="clock-verify-title">系统正在自动验证…</div>';
    if(firstWord)html+=`<div class="clock-verify-first-wrap"><div class="clock-verify-first">你之前抽到的牌：<b>${escapeHtml(firstWord)}</b></div></div>`;
    html+='<div class="clock-verify-cards">';
    clockState.verifyCards.forEach((c,i)=>{const picked=clockState.autoPickIdx===i;html+=`<div class="clock-verify-card${picked?' picked':''}" data-vid="${i}">${picked?escapeHtml(c.word):'⭐'}</div>`;});
    html+='</div>';
    html+=`<div class="clock-auto-tip">${clockState.autoPickIdx>=0?'正在比对验证结果……':'无需手动选择，系统会自动从这 3 张牌中抽出 1 张进行验证'}</div>`;
    body.innerHTML=html;
}
function clockAutoPickVerifyCard(idx){
    const picked=clockState.verifyCards[idx];
    if(!picked||!clockState.firstCard)return;
    clockState.autoPickIdx=idx;renderClockPage();
    const isMatch=picked.id===clockState.firstCard.id;
    const firstWord=clockState.firstCard.word;
    const t=setTimeout(()=>{
        if(isMatch){
            showModal('✅ 验证成功',`<div class="clock-first-ref">你之前抽到的牌：<b>${escapeHtml(firstWord)}</b></div><div class="clock-picked-card">${escapeHtml(picked.word)}</div><div class="clock-picked-hint" style="color:#10b981;">系统自动验证结果与首次一致，可信度较高</div><div class="modal-actions"><button class="btn-confirm" onclick="closeModal();clockBackHome();">完成</button></div>`);
        }else{
            clockState.retryCount++;
            const isFinal=clockState.retryCount>=2;
            if(isFinal){showModal('😔 验证失败',`<div class="clock-first-ref">你之前抽到的牌：<b>${escapeHtml(firstWord)}</b></div><div class="clock-picked-card">${escapeHtml(picked.word)}</div><div class="clock-picked-hint" style="color:#ef4444;font-weight:600;">系统自动验证两次均不一致，对方可能在忙，请稍后重试</div><div class="modal-actions"><button class="btn-confirm" onclick="closeModal();clockBackHome();">知道了</button></div>`);}
            else{showModal('🤔 验证不一致',`<div class="clock-first-ref">你之前抽到的牌：<b>${escapeHtml(firstWord)}</b></div><div class="clock-picked-card">${escapeHtml(picked.word)}</div><div class="clock-picked-hint">系统自动验证结果与首次不一致，是否重新验证一次？</div><div class="modal-actions"><button class="btn-cancel" onclick="closeModal();clockBackHome();">取消</button><button class="btn-confirm" onclick="clockRetry()">重新验证</button></div>`);}
        }
    },700);
    addClockTimer(t);
}
function clockRetry(){closeModal();const cards=getClockCards(clockState.direction,clockState.targetContactId);if(cards.length===0){showToast('该方向还没有可用查岗字卡');clockBackHome();return;}clockStartDraw();}

function openClockCardSetting(direction){
    ensureClockCards();
    clockState.cardDir=direction;
    if(clockState.clockOwnerId==null){const c=getActiveContact();clockState.clockOwnerId = (c && !isGroup(c)) ? c.id : (data.contacts.filter(x=>!isGroup(x))[0]?.id || null);}
    clockState.stage='cards';
    renderClockPage();
}
function clockCardsBack(){clockState.stage='home';clockState.cardDir=null;renderClockPage();}
function setClockScope(scope){clockScope=scope;renderClockCardsManage(document.getElementById('clockBody'));}
function changeClockOwner(id){clockState.clockOwnerId=id;renderClockCardsManage(document.getElementById('clockBody'));}
function renderClockCardsManage(body){
    ensureClockCards();
    const dir=clockState.cardDir||'place';
    const isPlace=dir==='place';
    const singles=data.contacts.filter(c=>!isGroup(c));
    let ownerId=clockState.clockOwnerId;
    if(clockScope==='private'){if(!ownerId){const c=getActiveContact();ownerId=(c && !isGroup(c))?c.id:(singles[0]?singles[0].id:null);clockState.clockOwnerId=ownerId;}}
    const allList=isPlace?data.clockCards.place:data.clockCards.action;
    const list=allList.filter(x=>{if(x.scope==='shared')return true;if(x.scope==='private'&&x.ownerId===ownerId)return true;return false;});
    const title=isPlace?'📍 位置字卡':'🎯 干什么字卡';
    let html='';
    html+=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;"><button class="btn-outline" style="color:#fff;border-color:rgba(255,255,255,.3);" onclick="clockCardsBack()">‹ 返回</button><span style="font-weight:600;font-size:15px;">${title}</span><span style="margin-left:auto;font-size:12px;opacity:.6;">共 ${list.length} 张</span></div>`;
    html+=`<div style="display:flex;gap:6px;margin-bottom:12px;"><button class="wc-scope-btn ${clockScope==='shared'?'active':''}" onclick="setClockScope('shared')" style="${clockScope==='shared'?'background:#8B5CF6;':'background:rgba(255,255,255,.1);'}">公共</button><button class="wc-scope-btn ${clockScope==='private'?'active':''}" onclick="setClockScope('private')" style="${clockScope==='private'?'background:#8B5CF6;':'background:rgba(255,255,255,.1);'}">独立</button></div>`;
    if(clockScope==='private'){
        if(singles.length===0){html+=`<div style="text-align:center;padding:20px;color:rgba(255,255,255,.5);">还没有联系人，无法创建独立字卡</div>`;}
        else{let opts=singles.map(c=>`<option value="${c.id}" ${c.id===ownerId?'selected':''}>${escapeHtml(c.name)}</option>`).join('');html+=`<select onchange="changeClockOwner(this.value)" style="width:100%;padding:9px 12px;border:1px solid rgba(255,255,255,.2);border-radius:10px;background:rgba(255,255,255,.08);color:#fff;font-size:14px;outline:none;font-family:inherit;margin-bottom:12px;">${opts}</select>`;}
    }
    html+=`<div style="display:flex;gap:8px;margin-bottom:10px;"><input id="clockNewCardInput" placeholder="输入字卡内容（每行一条）" style="flex:1;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#fff;font-size:14px;outline:none;font-family:inherit;"><button class="btn-primary" style="padding:10px 16px;border-radius:10px;background:linear-gradient(135deg,#8B5CF6,#A78BFA);" onclick="clockAddCard()">添加</button></div>`;
    html+=`<div style="margin-bottom:12px;"><button class="btn-outline" style="width:100%;color:rgba(255,255,255,.8);border-color:rgba(255,255,255,.25);" onclick="clockBatchImport()">📥 批量导入</button></div>`;
    if(!list.length){html+=`<div style="text-align:center;padding:40px 20px;color:rgba(255,255,255,.5);"><div style="font-size:44px;margin-bottom:12px;opacity:.6;">📇</div><div>还没有字卡，先添加一些吧</div></div>`;}
    else{
        html+='<div style="display:flex;flex-direction:column;gap:8px;">';
        list.forEach(x=>{const scopeTag=x.scope==='shared'?'公共':'独立';html+=`<div style="display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:11px 12px;"><span style="flex:1;font-size:14px;word-break:break-word;">${escapeHtml(x.word)}</span><span style="font-size:10px;padding:1px 6px;border-radius:6px;background:${x.scope==='shared'?'rgba(139,92,246,.3)':'rgba(239,68,68,.25)'};color:#fff;">${scopeTag}</span><button style="background:none;border:none;color:#A78BFA;font-size:16px;cursor:pointer;padding:2px 6px;" onclick="clockEditCard('${x.id}')">✎</button><button style="background:none;border:none;color:#FCA5A5;font-size:16px;cursor:pointer;padding:2px 6px;" onclick="clockDeleteCard('${x.id}')">🗑</button></div>`;});
        html+='</div>';
    }
    body.innerHTML=html;
}
function clockAddCard(){
    const inp=document.getElementById('clockNewCardInput');
    if(!inp)return;
    const val=inp.value.trim();
    if(!val){showToast('请输入内容');return;}
    ensureClockCards();
    const dir=clockState.cardDir||'place';
    const list=dir==='place'?data.clockCards.place:data.clockCards.action;
    let ownerId=null;
    if(clockScope==='private'){ownerId=clockState.clockOwnerId;if(!ownerId){showToast('请先选择联系人');return;}}
    const words=val.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
    const existing=new Set(list.filter(x=>x.scope===clockScope&&x.ownerId===ownerId).map(x=>x.word));
    let added=0,skipped=0;
    words.forEach(w=>{if(existing.has(w)){skipped++;return;}list.push({id:genId(),word:w,scope:clockScope,ownerId});existing.add(w);added++;});
    saveData(true);renderClockCardsManage(document.getElementById('clockBody'));
    if(added)showToast(`已添加 ${added} 张${skipped?`，跳过 ${skipped} 张重复`:''}`);
    else showToast('内容已存在');
}
function clockBatchImport(){
    showModal('📥 批量导入查岗字卡',`<label>每行一条</label><textarea id="clockBatchInput" rows="8" placeholder="客厅&#10;卧室&#10;公司"></textarea><div class="setting-sub">将导入到当前作用域（${clockScope==='shared'?'公共':'当前联系人独立'}）</div><div class="modal-actions"><button class="btn-cancel" onclick="closeModal()">取消</button><button class="btn-confirm" onclick="confirmClockBatchImport()">导入</button></div>`);
}
function confirmClockBatchImport(){
    const ta=document.getElementById('clockBatchInput');
    if(!ta)return;
    const lines=ta.value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
    if(!lines.length){showToast('请输入内容');return;}
    ensureClockCards();
    const dir=clockState.cardDir||'place';
    const list=dir==='place'?data.clockCards.place:data.clockCards.action;
    let ownerId=null;
    if(clockScope==='private'){ownerId=clockState.clockOwnerId;if(!ownerId){showToast('请先选择联系人');return;}}
    const existing=new Set(list.filter(x=>x.scope===clockScope&&x.ownerId===ownerId).map(x=>x.word));
    let added=0,skipped=0;
    lines.forEach(w=>{if(existing.has(w)){skipped++;return;}list.push({id:genId(),word:w,scope:clockScope,ownerId});existing.add(w);added++;});
    saveData(true);closeModal();renderClockCardsManage(document.getElementById('clockBody'));
    showToast(`导入完成：新增 ${added} 张，跳过 ${skipped} 张`);
}
function clockDeleteCard(id){
    const dir=clockState.cardDir||'place';
    const list=dir==='place'?data.clockCards.place:data.clockCards.action;
    const idx=list.findIndex(x=>x.id===id);
    if(idx<0)return;
    if(!confirm('删除这张查岗字卡？'))return;
    list.splice(idx,1);saveData(true);
    renderClockCardsManage(document.getElementById('clockBody'));
    showToast('已删除');
}
function clockEditCard(id){
    const dir=clockState.cardDir||'place';
    const list=dir==='place'?data.clockCards.place:data.clockCards.action;
    const card=list.find(x=>x.id===id);
    if(!card)return;
    const nv=prompt('编辑查岗字卡：',card.word);
    if(nv===null)return;
    const w=nv.trim();
    if(!w){showToast('内容不能为空');return;}
    if(list.some(x=>x.word===w&&x.id!==id)){showToast('⚠️ 该字卡已存在');return;}
    card.word=w;saveData(true);
    renderClockCardsManage(document.getElementById('clockBody'));
    showToast('已更新');
}

function importData(){
    const input=document.createElement('input');input.type='file';input.accept='application/json';
    input.onchange=function(e){
        const file=e.target.files[0];if(!file)return;
        const reader=new FileReader();
        reader.onload=function(ev){
            try{
                const imported=JSON.parse(ev.target.result);
                if(!imported||typeof imported!=='object'){showToast('⚠️ 无效的数据文件');return;}
                if(!confirm('导入将覆盖对应内容，确定继续吗？'))return;
                const def=defaultData();
                if(imported._type==='lingdong_selective'){
                    const keys=Object.keys(imported).filter(k=>!k.startsWith('_'));
                    keys.forEach(k=>{if(k==='theme'&&imported.theme)data.theme=Object.assign({},data.theme,imported.theme);else if(k==='settings'&&imported.settings)data.settings=Object.assign({},data.settings,imported.settings);else if(k==='replySettings'&&imported.replySettings)data.replySettings=Object.assign({},data.replySettings,imported.replySettings);else if(k==='patSettings'&&imported.patSettings)data.patSettings=Object.assign({},data.patSettings,imported.patSettings);else if(imported[k]!==undefined)data[k]=imported[k];});
                }else data=deepMerge(def,imported);
                initDataFields();saveData(true);applyTheme();renderHeader();renderMessagesNow();renderContacts();
                updateNavBadge();
                if(document.getElementById('pageSettings').classList.contains('active'))renderSettingsPage();
                if(musicPanelOpen)renderMusicPage();
                if(letterPanelOpen)renderLetterPage();
                updateLetterMenuDot();
                if(data.replySettings.randomStatus)startRandomStatus();
                scheduleAutoMessage();
                data.contacts.forEach(c=>{ if(isGroup(c) && c.groupAuto && c.groupAuto.enabled) scheduleGroupAuto(c.id); });
                showToast('✅ 数据导入成功');
            }catch(err){showToast('⚠️ 数据解析失败');}
        };
        reader.readAsText(file);
    };
    input.click();
}

function pokePartnerContinue(){
    const c=getActiveContact();if(!c || c.blocked) return;
    const cid = c.id;
    scheduler.cancelByKey('pokeContinue');
    scheduler.add(()=>{
        const cc = getContact(cid);
        if(!cc) return;
        const count = Math.random() < 0.5 ? 1 : 2;
        for(let i=0;i<count;i++){
            scheduler.add(()=>{
                const cc2 = getContact(cid);
                if(!cc2) return;
                const cards2 = getCardsForContact(cc2);
                let text;
                if(cards2.length) text = cards2[Math.floor(Math.random()*cards2.length)];
                else { const fb = ['嗯嗯','在的','怎么啦','继续说','我在听']; text = fb[Math.floor(Math.random()*fb.length)]; }

                let senderName = '';
                let senderId = '';
                if(isGroup(cc2)){
                    const now = Date.now();
                    const members = (cc2.members||[]).map(id=>getContact(id)).filter(m => m && !(cc2.mutedUntil && cc2.mutedUntil[m.id] && cc2.mutedUntil[m.id] > now));
                    if(members.length){
                        const m = members[Math.floor(Math.random()*members.length)];
                        senderName = m.name;
                        senderId = m.id;
                    }
                }

                addMessage('partner', text, 'text', null, false, false, senderName, cid, senderId);
                if(i===count-1) afterPartnerReply(cid);
            }, i*700, 'pokeContinueMsg_'+i);
        }
    }, 3000, 'pokeContinue');
}

function restoreMuteTimers(){
    const now=Date.now();
    data.contacts.forEach(c=>{
        if(!isGroup(c)||!c.mutedUntil)return;
        Object.keys(c.mutedUntil).forEach(memberId=>{
            const until=c.mutedUntil[memberId];
            if(until<=now){delete c.mutedUntil[memberId];}
            else{
                const remain=until-now;
                const m=getContact(memberId);
                const name=m?m.name:'成员';
                scheduler.add(()=>{
                    const cc=getContact(c.id);
                    if(cc && cc.mutedUntil && cc.mutedUntil[memberId]){
                        delete cc.mutedUntil[memberId];
                        saveData(true);
                        addMessage('me', `「${name}」的禁言时间已到，已自动解除`, 'sys', null, true, false, '', cc.id);
                        if(document.getElementById('pageContacts').classList.contains('active')) renderContacts();
                        if(data.activeContactId===cc.id && document.getElementById('pageChatInfo').classList.contains('active')) renderChatInfo();
                        showToast(`「${name}」的禁言时间已到，已自动解除`);
                    }
                },remain,'unmute_restore_'+c.id+'_'+memberId);
            }
        });
    });
    saveData();
}

let backExitConfirmed = false;

function pushGuard(){

function setupBackGuard(){
    try{ history.pushState({lingdongGuard:true},'',location.href); backGuardReady = true; }
    catch(e){ return; }
    window.addEventListener('popstate', function(){
        if(!backGuardReady) return;
        if(backExitConfirmed) return;

        const letterEl=document.getElementById('letterPanel');
        const musicEl=document.getElementById('musicPanel');
        const divEl=document.getElementById('divinationPanel');
        const clockEl=document.getElementById('clockPanel');
        const plusEl=document.getElementById('plusPanel');
        const emojiEl=document.getElementById('emojiPanel');
        const modalEl=document.getElementById('modalContainer');
        if(modalEl && modalEl.innerHTML.trim() !== ''){ closeModal(); pushGuard(); return; }
        if(letterEl&&letterEl.classList.contains('open')){closeLetter();pushGuard();return;}
        if(musicEl&&musicEl.classList.contains('open')){closeMusic();pushGuard();return;}
        if(divEl&&divEl.classList.contains('open')){closeDivination();pushGuard();return;}
        if(clockEl&&clockEl.classList.contains('open')){closeClock();pushGuard();return;}
        if(plusEl&&plusEl.classList.contains('open')){closePlusPanel();pushGuard();return;}
        if(emojiEl&&emojiEl.classList.contains('open')){closeEmojiPanel();pushGuard();return;}

        const chatPage=document.getElementById('pageChat');
        const infoPage=document.getElementById('pageChatInfo');
        const toolsPage=document.getElementById('pageTools');
        const settingsPage=document.getElementById('pageSettings');
        if(chatPage&&chatPage.classList.contains('active')){backToContacts();pushGuard();return;}
        if(infoPage&&infoPage.classList.contains('active')){switchPage('chat');pushGuard();return;}
        if(toolsPage&&toolsPage.classList.contains('active')){switchPage('contacts');pushGuard();return;}
        if(settingsPage&&settingsPage.classList.contains('active')){switchPage('contacts');pushGuard();return;}

        if(_backPressCount === 1){
            clearTimeout(_backTimer);
            _backPressCount = 0;
            backExitConfirmed = true;
            try{
                if(history.length > 1){ history.go(-history.length); }
                else { history.back(); }
            }catch(e){}
            return;
        }
        _backPressCount = 1;
        clearTimeout(_backTimer);
        _backTimer = setTimeout(()=>{ _backPressCount = 0; }, 2000);
        showToast('再按一次返回退出');
        pushGuard();
    });
}

async function restoreFromIDB(force){
    try{
        if(!('indexedDB' in window)) return;
        let localParsed = null;
        try{
            let raw = localStorage.getItem(STORAGE_KEY);
            if(!raw) raw = localStorage.getItem(BACKUP_KEY);
            if(raw) localParsed = JSON.parse(raw);
        }catch(e){}

        let idbParsed = null;
        const idbRaw = await idbGet('data');
        if(idbRaw){
            try{ idbParsed = JSON.parse(idbRaw); }catch(e){}
        }

        const localTime = (localParsed && localParsed._updatedAt) || 0;
        const idbTime = (idbParsed && idbParsed._updatedAt) || 0;
        const useIDB = force || (!localParsed) || (idbParsed && idbTime > localTime);

        if(useIDB && idbParsed && typeof idbParsed==='object' && !Array.isArray(idbParsed)){
            const hasData = (idbParsed.contacts && idbParsed.contacts.length) ||
                            (idbParsed.emojis && idbParsed.emojis.length) ||
                            (idbParsed.wordCards && idbParsed.wordCards.groups && idbParsed.wordCards.groups.length) ||
                            (idbParsed.music && idbParsed.music.list && idbParsed.music.list.length) ||
                            (idbParsed.letters && idbParsed.letters.list && idbParsed.letters.list.length);
            if(hasData){
                data = deepMerge(defaultData(), idbParsed);
                initDataFields();
                await restoreAssetsFromIDB();
                saveData(true);
                return;
            }
        }

        if(localParsed && localParsed._slimmed){
            await restoreAssetsFromIDB();
            saveData(true);
        }
    }catch(e){}
}

async function restoreAssetsFromIDB(){
    try{
        const userAvatar = await idbGet('user_avatar');
        if(userAvatar && data.user && !data.user.avatar){
            data.user.avatar = userAvatar;
        }
        const contactAssets = await idbGet('contact_assets');
        if(Array.isArray(contactAssets)){
            const map = {};
            contactAssets.forEach(a=>{ if(a && a.id && a.type) map[a.type+':'+a.id] = a.data; });
            (data.contacts||[]).forEach(c=>{
                if(!c) return;
                if(!c.avatar && map['contact_avatar:'+c.id]) c.avatar = map['contact_avatar:'+c.id];
                if(!c.bgImage && map['contact_bg:'+c.id]) c.bgImage = map['contact_bg:'+c.id];
                if(Array.isArray(c.messages)){
                    c.messages.forEach(m=>{
                        if(!m) return;
                        if(!m.content && map['msg_content:'+m.id]) m.content = map['msg_content:'+m.id];
                        if(m.type==='recall' && !m.recalledContent && map['msg_recalled:'+m.id]) m.recalledContent = map['msg_recalled:'+m.id];
                    });
                }
            });
        }
        const emojis = await idbGet('emojis');
        if(Array.isArray(emojis)){
            const map = {};
            emojis.forEach(e=>{ if(e && e.id) map[e.id] = e.dataUrl||''; });
            (data.emojis||[]).forEach(e=>{ if(e && !e.dataUrl && map[e.id]) e.dataUrl = map[e.id]; });
        }
        const musicUrls = await idbGet('music_urls');
        if(Array.isArray(musicUrls)){
            const map = {};
            musicUrls.forEach(s=>{ if(s && s.id) map[s.id] = s.url||''; });
            if(data.music && Array.isArray(data.music.list)){
                data.music.list.forEach(s=>{ if(s && !s.url && map[s.id]) s.url = map[s.id]; });
            }
        }
    }catch(e){}
}

function setupKeyboardViewportFix(){
    const app = document.getElementById('app');
    const vv = window.visualViewport;
    if(!app || !vv) return;
    let applying = false;
    const resetApp = () => {
        app.style.position = '';
        app.style.top = '';
        app.style.left = '';
        app.style.right = '';
        app.style.height = '';
        app.style.maxWidth = '';
        app.style.margin = '';
    };
    const apply = () => {
        if(applying) return;
        applying = true;
        requestAnimationFrame(()=>{
            applying = false;
            const h = Math.round(vv.height);
            const top = Math.round(vv.offsetTop);
            const winH = window.innerHeight;
            const kbOpen = h < winH - 120;
            if(kbOpen && h > 240 && h < winH){
                app.style.position = 'fixed';
                app.style.top = top + 'px';
                app.style.left = '0';
                app.style.right = '0';
                app.style.height = h + 'px';
                app.style.maxWidth = '480px';
                app.style.margin = '0 auto';
                if(isChatPageVisible()){
                    const area = document.getElementById('message-area');
                    if(area) area.scrollTop = area.scrollHeight;
                }
            }else{
                resetApp();
            }
        });
    };
    vv.addEventListener('resize', apply);
    vv.addEventListener('scroll', apply);
    apply();
}

function scheduleSplashHide(){
    const splash = document.getElementById('splash');
    if(!splash) return;
    const img = document.getElementById('splashImg');
    const fallback = document.getElementById('splashFallback');
    let hidden = false;
    const hide = ()=>{ if(hidden) return; hidden = true; splash.classList.add('hide'); };
    const start = Date.now();
    const finish = (minDelay)=>{
        const wait = Math.max(0, minDelay - (Date.now() - start));
        setTimeout(hide, wait);
    };
    const showFallback = ()=>{
        if(fallback) fallback.style.display = 'flex';
        if(img) img.style.display = 'none';
    };
    if(img){
        if(img.complete){
            if(img.naturalWidth > 0) finish(1400);
            else { showFallback(); finish(900); }
        }else{
            img.addEventListener('load', ()=>finish(1400), {once:true});
            img.addEventListener('error', ()=>{ showFallback(); finish(900); }, {once:true});
            setTimeout(hide, 3500);
        }
    }else{
        setTimeout(hide, 2200);
    }
}

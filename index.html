function addMessage(sender,content,type,replyTo,silent,isAuto,senderName,contactId,senderId,extra){
    let c;
    if(contactId){
        c = getContact(contactId);
        if(!c){ console.warn('[addMessage] 联系人不存在:', contactId); return null; }
    }else{
        c = getActiveContact();
        if(!c) return null;
    }

    const msgType = type || 'text';

    if(sender === 'partner' && isGroup(c) && (msgType === 'text' || msgType === 'emoji' || msgType === 'image')){
        let targetMember = null;
        if(senderId){
            const m = getContact(senderId);
            if(m && (c.members||[]).includes(senderId)) {
                targetMember = m;
            }
        }
        if(!targetMember){
            const now = Date.now();
            let validMembers = (c.members||[]).map(id=>getContact(id)).filter(m => m && !(c.mutedUntil && c.mutedUntil[m.id] && c.mutedUntil[m.id] > now));
            if(!validMembers.length){
                validMembers = (c.members||[]).map(id=>getContact(id)).filter(Boolean);
            }
            if(validMembers.length){
                targetMember = validMembers[Math.floor(Math.random()*validMembers.length)];
            }
        }
        if(targetMember){
            senderId = targetMember.id;
            senderName = targetMember.name;
        } else {
            return null;
        }
    }

    const msg = {id:genId(),sender,content,timestamp:Date.now(),type:msgType,replyTo:replyTo||null,isAuto:!!isAuto,senderName:senderName||'',senderId:senderId||''};
    if(extra && typeof extra==='object') Object.assign(msg, extra);
    const isActive = (data.activeContactId === c.id) && isChatPageVisible();
    const wasNearBottom = isActive && isNearBottom(150);
    c.messages.push(msg);
    if(c.messages.length > 1500) c.messages = c.messages.slice(-1500);
    if(sender === 'partner' && !isActive){ c.unread = (c.unread || 0) + 1; }

    saveData(true);

    if(sender === 'partner' && !isActive){ updateNavBadge(); }
    if(isActive){
        appendMessageToDOM(msg);
        if(sender === 'me' || wasNearBottom) requestAnimationFrame(scrollToBottomImmediate);
    }else{
        const contactsPage = document.getElementById('pageContacts');
        if(contactsPage && contactsPage.classList.contains('active')) renderContacts();
    }

    // ===== 后台弹窗核心：无论前后台，只要收到对方消息就尝试弹系统通知 =====
    if(sender === 'partner' && !silent){
        playNotifySound();
        showSystemNotification(msg, false, c.id);
        try{if(navigator.vibrate)navigator.vibrate([80,40,80]);}catch(e){}
    }
    if(sender === 'partner' && !silent && (msg.type==='text'||msg.type==='emoji'||msg.type==='image')) schedulePartnerRecall(msg.id, c.id);
    return msg;
}
function sendMessage(){
    const c = getActiveContact(); if(!c){showToast('请先选择联系人');return;}
    const input = document.getElementById('msgInput');

// ======================================================================
function getCardsForContact(contact){
    if(!contact) return [];
    const cards = [];
    data.wordCards.groups.forEach(g=>{
        if(g.disabled) return;
        if(g.scope === 'shared'){ (g.cards||[]).forEach(c=>{if(c.word && !c.disabled)cards.push(c.word);}); }
        else if(g.scope === 'private' && g.ownerId === contact.id){ (g.cards||[]).forEach(c=>{if(c.word && !c.disabled)cards.push(c.word);}); }
        else if(g.scope === 'private' && isGroup(contact) && (contact.members||[]).includes(g.ownerId)){ (g.cards||[]).forEach(c=>{if(c.word && !c.disabled)cards.push(c.word);}); }
    });
    return cards;
}
function getAllCards(){
    let all=[];
    data.wordCards.groups.forEach(g=>{
        if(g.disabled) return;
        (g.cards||[]).forEach(c=>{if(c&&c.word&&!c.disabled)all.push(c.word);});
    });
    return all;
}
function schedulePartnerReply(){
    const c = getActiveContact(); if(!c) return;
    if(replyTimers[c.id]){clearTimeout(replyTimers[c.id]);delete replyTimers[c.id];}
    const s = data.replySettings;
    let minS = Number(s.minSeconds), maxS = Number(s.maxSeconds);
    if(isNaN(minS)||minS<0.5) minS=3;
    if(isNaN(maxS)||maxS<0.5) maxS=30;
    if(maxS<minS){const t=minS;minS=maxS;maxS=t;}
    const delay = (minS + Math.random()*(maxS-minS))*1000;
    replyTimers[c.id] = setTimeout(()=>{
        delete replyTimers[c.id];
        generatePartnerReply(c.id);
    },delay);
}
function pickQuoteTarget(contactId){
    const c = contactId ? getContact(contactId) : getActiveContact(); if(!c) return null;
    const myTextMsgs = (c.messages||[]).filter(m=>m.sender==='me'&&m.type==='text');
    if(!myTextMsgs.length) return null;
    const recent = myTextMsgs.slice(-15);
    return recent[Math.floor(Math.random()*recent.length)].id;
}
function pickTextEmoji(){
    const list = Array.isArray(data.textEmojis) ? data.textEmojis : [];
    if(!list.length) return '';
    return list[Math.floor(Math.random()*list.length)].text||'';
}
function buildSpellSentence(cards){
    const s = data.replySettings;
    let minC = Math.max(1,Math.round(Number(s.spellMinCount)||2));
    let maxC = Math.max(1,Math.round(Number(s.spellMaxCount)||3));
    if(maxC<minC){const t=minC;minC=maxC;maxC=t;}
    if(!cards.length) return '';
    const count = clamp(randInt(minC,maxC),1,cards.length);
    const pool = cards.slice();
    for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
    return pool.slice(0,count).join('，');
}

function schedulePartnerRecall(msgId, contactId){
    const s = data.replySettings || {};
    if(!s.recallEnabled) return;
    const prob = Number(s.recallProbability);
    if(isNaN(prob)||prob<=0) return;
    if(Math.random() >= prob) return;
    const delay = 2500 + Math.random()*4000;
    scheduler.add(()=>{
        const c = contactId ? getContact(contactId) : getActiveContact(); if(!c) return;
        const idx = c.messages.findIndex(m=>m.id===msgId);
        if(idx<0) return;
        const m = c.messages[idx];
        if(!m || m.sender !== 'partner') return;
        if(m.type!=='text'&&m.type!=='emoji'&&m.type!=='image') return;

        const recalledType = m.type;
        const recalledContent = m.content || '';
        const recalledSenderId = m.senderId || '';
        let recalledSenderName = m.senderName || '';

        let displayName = '';
        if(isGroup(c)){
            if(recalledSenderId){
                const mem = getContact(recalledSenderId);
                displayName = mem ? mem.name : (recalledSenderName || '成员');
            } else {
                displayName = recalledSenderName || '成员';
            }
            recalledSenderName = displayName;
        } else {
            displayName = c.name || '对方';
            recalledSenderName = displayName;
        }

        c.messages.splice(idx,1);
        saveData(true);

        const el = document.querySelector(`.msg-group[data-id="${msgId}"]`);
        if(el) el.remove();

        addMessage('partner', `${displayName} 撤回了一条消息`, 'recall', null, true, false, '', contactId, null, {
            recalledContent: recalledContent,
            recalledType: recalledType,
            recalledSenderName: recalledSenderName,
            recalledSenderId: recalledSenderId
        });
    }, delay, 'recall_'+msgId);
}

function generatePartnerReply(contactId){
    hideTypingIndicator(contactId);
    const c = contactId ? getContact(contactId) : getActiveContact();
    if(!c) return;
    const s = data.replySettings;
    const now = Date.now();
    const senders = isGroup(c)
        ? (c.members||[]).map(id=>getContact(id)).filter(m => m && !(c.mutedUntil && c.mutedUntil[m.id] && c.mutedUntil[m.id] > now))
        : [c];
    if(!senders.length) return;
    const pickSender = ()=>{ return senders[Math.floor(Math.random()*senders.length)]; };
    if(s.seenNoReplyEnabled && Math.random() < 0.15){
        const ps = pickSender();
        addMessage('partner', (ps.name || '对方') + ' 已读不回', 'readno', null, true, false, ps.name || '', contactId, ps.id || '');
        afterPartnerReply(contactId); return;
    }
    const cards = getCardsForContact(c);
    if(s.spellEnabled && cards.length>0 && Math.random()<0.5){
        const sentence = buildSpellSentence(cards);
        if(sentence){
            const quoteProb = Number(s.quoteProbability);
            const willQuote = Math.random() < (isNaN(quoteProb)?0.35:quoteProb);
            const quoteId = willQuote ? pickQuoteTarget(contactId) : null;
            const ps = pickSender();
            addMessage('partner', sentence, 'text', quoteId, false, false, ps.name || '', contactId, ps.id || '');
            afterPartnerReply(contactId); return;
        }
    }
    let minC = Number(s.cardReplyMinCount), maxC = Number(s.cardReplyMaxCount);
    if(isNaN(minC)||minC<1) minC=1;
    if(isNaN(maxC)||maxC<1) maxC=5;
    if(maxC<minC){const t=minC;minC=maxC;maxC=t;}
    minC = Math.round(minC); maxC = Math.round(maxC);
    const count = clamp(randInt(minC,maxC),1,20);
    const emojiProb = Number(s.emojiReplyProbability)||0;
    const hasEmoji = Array.isArray(data.emojis) && data.emojis.length>0;
    const willSendEmoji = hasEmoji && Math.random()<emojiProb;
    const quoteProb = Number(s.quoteProbability);
    const willQuote = Math.random() < (isNaN(quoteProb)?0.35:quoteProb);
    const quoteId = willQuote ? pickQuoteTarget(contactId) : null;
    const teList = Array.isArray(data.textEmojis) ? data.textEmojis : [];
    const teOn = !!s.textEmojiEnabled && teList.length>0;
    let teProb = Number(s.textEmojiProbability); if(isNaN(teProb)) teProb = 0.2;
    const willTextEmoji = teOn && Math.random()<teProb;
    const teWithCard = s.textEmojiWithCard !== false;
    const teText = willTextEmoji ? pickTextEmoji() : '';
    if(willTextEmoji && !teWithCard){
        scheduler.add(()=>{
            const ps = pickSender();
            addMessage('partner', teText, 'text', quoteId, false, false, ps.name || '', contactId, ps.id || '');
            afterPartnerReply(contactId);
        }, 300+Math.random()*400, 'replyTextEmoji');
        return;
    }
    if(cards.length === 0 && !willSendEmoji){
        const fb = ['嗯嗯','好的','明白','收到','👍','哈哈','好的呢','了解','在的','怎么啦'];
        let content = fb[Math.floor(Math.random()*fb.length)];
        if(willTextEmoji && teText) content = content+' '+teText;
        const ps = pickSender();
        addMessage('partner', content, 'text', quoteId, false, false, ps.name || '', contactId, ps.id || '');
        afterPartnerReply(contactId); return;
    }
    if(cards.length > 0){
        const shuffled = cards.slice();
        for(let i=shuffled.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]];}
        const selected = shuffled.slice(0,count);
        const step = Math.max(300,Math.min(700,Math.round(2200/Math.max(1,selected.length))));
        selected.forEach((word,index)=>{
            scheduler.add(()=>{
                const ps = pickSender();
                let content = word;
                if(index === selected.length-1 && willTextEmoji && teText) content = content+' '+teText;
                addMessage('partner', content, 'text', index===0?quoteId:null, false, false, ps.name || '', contactId, ps.id || '');
                if(index === selected.length-1){
                    if(willSendEmoji){
                        scheduler.add(()=>{
                            const emoji = data.emojis[Math.floor(Math.random()*data.emojis.length)];
                            const ps2 = pickSender();
                            addMessage('partner', emoji.dataUrl, 'emoji', null, false, false, ps2.name || '', contactId, ps2.id || '');
                            afterPartnerReply(contactId);
                        }, 400, 'replyEmoji');
                    }else afterPartnerReply(contactId);
                }
            }, index*step+200, 'replySeq_'+index);
        });
    }else if(willSendEmoji){
        scheduler.add(()=>{
            const emoji = data.emojis[Math.floor(Math.random()*data.emojis.length)];
            const ps = pickSender();
            addMessage('partner', emoji.dataUrl, 'emoji', null, false, false, ps.name || '', contactId, ps.id || '');
            afterPartnerReply(contactId);
        }, 400, 'replyEmoji');
    }
}
function afterPartnerReply(contactId){
    maybePat(contactId);
    maybeCall();
    maybeMusicInteraction();
    maybePartnerWriteLetter();
}
function maybePat(contactId){
    const prob = Number(data.patSettings.probability)||0;
    if(Math.random() < prob){
        const contents = data.patSettings.contents || ['拍了拍你'];
        if(!contents.length) return;
        const content = contents[Math.floor(Math.random()*contents.length)];
        const c = contactId ? getContact(contactId) : getActiveContact();
        if(!c) return;

        let senderName = c.name || '对方';
        let senderId = '';

        if(isGroup(c)){
            const now = Date.now();
            const members = (c.members||[]).map(id=>getContact(id)).filter(m => m && !(c.mutedUntil && c.mutedUntil[m.id] && c.mutedUntil[m.id] > now));
            if(!members.length) return;
            const m = members[Math.floor(Math.random()*members.length)];
            senderName = m.name;
            senderId = m.id;
        }

        addMessage('partner', senderName + ' ' + content, 'pat', null, false, false, senderName, contactId, senderId);
    }
}
function maybeCall(){
    const prob = Number(data.replySettings.callProbability);
    if(isNaN(prob)) return;
    if(Math.random() < prob) setTimeout(()=>{ if(!callState) showCallModal(false); }, 1500+Math.random()*2500);
}

function updateGroupAutoField(key, val){
    const c = getActiveContact();
    if(!c || !isGroup(c)) return;
    if(!c.groupAuto) c.groupAuto = {enabled:false, minMinutes:5, maxMinutes:30, minCount:1, maxCount:3};
    let n = parseFloat(val);

    if(key === 'minCount' || key === 'maxCount') n = Math.max(1, Math.round(n));

function scheduleGroupAuto(contactId){
    scheduler.cancelByKey('groupAuto_'+contactId);
    const c = getContact(contactId);
    if(!c || !isGroup(c) || !c.groupAuto || !c.groupAuto.enabled) return;
    const ga = c.groupAuto;
    let minM = Number(ga.minMinutes), maxM = Number(ga.maxMinutes);
    if(isNaN(minM) || minM < 0.1) minM = 5;
    if(isNaN(maxM) || maxM < 0.1) maxM = 30;
    if(maxM < minM){ const t = minM; minM = maxM; maxM = t; }
    const delay = (minM + Math.random()*(maxM-minM)) * 60000;
    scheduler.add(()=>{
        sendGroupAutoMessage(contactId);
        scheduleGroupAuto(contactId);
    }, delay, 'groupAuto_'+contactId);
}
function sendGroupAutoMessage(contactId){
    const c = getContact(contactId);
    if(!c || !isGroup(c) || !c.groupAuto || !c.groupAuto.enabled) return;
    const now = Date.now();
    const senders = (c.members||[]).map(id=>getContact(id)).filter(m => m && !(c.mutedUntil && c.mutedUntil[m.id] && c.mutedUntil[m.id] > now));
    if(!senders.length) return;
    const ga = c.groupAuto;
    let minC = Math.max(1, Math.round(Number(ga.minCount)||1));
    let maxC = Math.max(1, Math.round(Number(ga.maxCount)||3));
    if(maxC < minC){ const t = minC; minC = maxC; maxC = t; }
    const count = clamp(randInt(minC, maxC), 1, 20);

    const sender = senders[Math.floor(Math.random()*senders.length)];
    const senderName = sender.name || '成员';
    const msgs = [];
    for(let i=0;i<count;i++){
        if(cards.length > 0 && Math.random() < 0.7) msgs.push(cards[Math.floor(Math.random()*cards.length)]);

    showModal('群成员管理', html);
}
function toggleGroupAdmin(memberId){

function toggleGroupMute(memberId){
    const c = getActiveContact();
    if(!c || !isGroup(c)) return;
    const m = getContact(memberId);
    if(!m) return;
    if(!c.mutedUntil) c.mutedUntil = {};

    }

function confirmGroupMute(memberId){
    const inp = document.getElementById('muteMinutesInput');
    const minutes = parseInt(inp.value, 10);
    if(isNaN(minutes) || minutes < 1){showToast('请输入有效分钟数');return;}
    const c = getActiveContact();
    if(!c || !isGroup(c)) return;
    const m = getContact(memberId);
    if(!m) return;
    if(!c.mutedUntil) c.mutedUntil = {};
    c.mutedUntil[memberId] = Date.now() + minutes * 60000;
    addMessage('me', `「${m.name}」被禁言 ${minutes} 分钟`, 'sys', null, true, false, '', c.id);
    showToast(`已禁言「${m.name}」${minutes} 分钟`);
    saveData(true);
    renderChatInfo();
    openGroupMemberManage(memberId);
    scheduler.add(() => {
        const cc = getContact(c.id);
        if(cc && cc.mutedUntil && cc.mutedUntil[memberId]){
            delete cc.mutedUntil[memberId];
            saveData(true);
            addMessage('me', `「${m.name}」的禁言时间已到，已自动解除`, 'sys', null, true, false, '', cc.id);
            if(document.getElementById('pageContacts').classList.contains('active')) renderContacts();
            if(data.activeContactId === cc.id && document.getElementById('pageChatInfo').classList.contains('active')) renderChatInfo();
            showToast(`「${m.name}」的禁言时间已到，已自动解除`);
        }
    }, minutes * 60000, 'unmute_' + c.id + '_' + memberId);
}
function removeGroupMember(memberId){
    const c = getActiveContact();
    if(!c || !isGroup(c)) return;
    const m = getContact(memberId);
    if(!m) return;
    if(!confirm(`确定将「${m.name}」移出群聊吗？`)) return;
    c.members = (c.members||[]).filter(id => id !== memberId);
    if(c.admins) c.admins = c.admins.filter(id => id !== memberId);
    if(c.mutedUntil) delete c.mutedUntil[memberId];
    addMessage('me', `「${m.name}」被移出群聊`, 'sys', null, true, false, '', c.id);
    saveData(true);
    closeModal();
    renderChatInfo();
    showToast(`已将「${m.name}」移出群聊`);
    if(Math.random() < 0.25){
        const delay = 2000 + Math.random() * 3000;
        scheduler.add(() => {
            const cc = getContact(c.id);
            if(!cc || !isGroup(cc)) return;
            if(!cc.members.includes(memberId)) cc.members.push(memberId);
            addMessage('me', `「${m.name}」强行进入了群聊`, 'sys', null, true, false, '', cc.id);
            saveData(true);
            if(data.activeContactId === cc.id) renderChatInfo();
            showToast(`「${m.name}」强行进入了群聊`);
        }, delay, 'forceJoin_' + memberId);
    }
}

function getScopeContactId(){
    if(wordCardScope === 'shared') return null;
    if(wordCardOwnerId) return wordCardOwnerId;
    if(data.activeContactId) return data.activeContactId;
    const singles = data.contacts.filter(c=>!isGroup(c));
    return singles.length ? singles[0].id : null;
}

function buildWordCardContentHtml(){
    const isShared = wordCardScope === 'shared';
    let html = '';
    if(!isShared){
        const singles = data.contacts.filter(c=>!isGroup(c));
        if(singles.length === 0){
            return `<div class="empty-state"><div class="empty-icon">👤</div><div>还没有联系人，无法创建独立字卡</div></div>`;
        }
    }
    if(wordCardSearch && wordCardSearch.trim()){
        return renderWordCardSearchResults(wordCardSearch.trim());
    }
    const groups = data.wordCards.groups.filter(g=>{
        if(isShared) return g.scope === 'shared';
        return g.scope === 'private' && g.ownerId === getScopeContactId();
    });
    if(groups.length === 0){
        html += `<div class="empty-state"><div class="empty-icon">📇</div><div>${isShared?'还没有共用字卡分组':'该联系人还没有独立字卡分组'}</div><button class="btn-primary mt-8" onclick="showAddGroupModal()">+ 创建分组</button></div>`;
        html += `<div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;"><button class="btn-outline" onclick="exportWordCards()">📤 导出字卡备份</button><button class="btn-outline" onclick="importWordCards()">📥 导入字卡</button></div>`;
        return html;
    }
    groups.forEach(g=>{
        const count = g.cards ? g.cards.length : 0;
        const disabled = !!g.disabled;
        const disabledBadge = disabled ? '<span class="disabled-badge">已停用</span>' : '';
        html += `<div class="word-group-item" style="${disabled?'opacity:.6;':''}" onclick="showGroupDetail('${g.id}')"><div class="group-info"><div class="group-name">📂 ${escapeHtml(g.name)} <span class="scope-badge ${g.scope}">${g.scope==='shared'?'共用':'独立'}</span>${disabledBadge}</div><div class="group-count">${count} 个字卡${disabled?' · 该分组已停用':''}</div></div><div class="group-actions"><button class="add-card-btn" onclick="event.stopPropagation();showAddCardModal('${g.id}')">➕ 添加</button><button onclick="event.stopPropagation();toggleGroupDisabled('${g.id}')" title="${disabled?'启用分组':'停用分组'}">${disabled?'▶️':'⏸'}</button><button onclick="event.stopPropagation();showBatchImportModal('${g.id}')" title="批量导入">📥</button><button onclick="event.stopPropagation();deleteGroup('${g.id}')" title="删除分组">🗑</button></div></div>`;
    });
    html += `<div style="margin-top:12px;text-align:center;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;"><button class="btn-primary" onclick="showAddGroupModal()">+ 新建分组</button><button class="btn-outline" onclick="showQuickAddCard()">📝 快速添加</button></div>`;
    html += `<div style="margin-top:14px;padding-top:14px;border-top:1px dashed var(--border);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;"><button class="btn-outline" onclick="exportWordCards()">📤 导出字卡备份</button><button class="btn-outline" onclick="importWordCards()">📥 导入字卡</button></div>`;
    html += `<div class="setting-sub" style="text-align:center;margin-top:8px;">共用字卡所有人都能用；独立字卡只对该联系人生效；停用的分组/字卡不会被发送</div>`;
    return html;
}

function renderWordCardPage(){
    const body = document.getElementById('wordCardBody'); if(!body) return;
    clearTimeout(_wcSearchTimer); _wcSearchTimer = null;
    _wcBatchMode = false; _wcBatchSelected.clear(); _wcBatchGroupId = null;
    const isShared = wordCardScope === 'shared';
    let toolbarHtml = '';
    toolbarHtml += `<div class="wc-toolbar"><div class="wc-scope-switch"><button class="wc-scope-btn ${isShared?'active':''}" onclick="setWordScope('shared')">共用字卡</button><button class="wc-scope-btn ${!isShared?'active':''}" onclick="setWordScope('private')">独立字卡</button></div><div class="wc-search-wrap ${wordCardSearch?'has-text':''}" id="wcSearchWrap"><span class="search-icon">🔍</span><input type="text" id="wcSearchInput" placeholder="搜索字卡..." value="${escAttr(wordCardSearch)}" oninput="onWordCardSearch(this.value)" oncompositionstart="wcSearchCompStart()" oncompositionend="wcSearchCompEnd(this.value)" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"><button class="clear-search" onclick="clearWordCardSearch()" type="button">✕</button></div><button class="wc-dedupe-btn" onclick="dedupeWordCardsUI()" title="清理重复字卡">去重复</button></div>`;
    if(!isShared){
        const singles = data.contacts.filter(c=>!isGroup(c));
        if(singles.length > 0){
            const currentId = getScopeContactId();
            let opts = '';
            singles.forEach(c=>{ opts += `<option value="${c.id}" ${c.id===currentId?'selected':''}>${escapeHtml(c.name)}</option>`; });

}

function updateWordCardContent(){
    const content = document.getElementById('wcContent');
    if(!content){ renderWordCardPage(); return; }
    content.innerHTML = buildWordCardContentHtml();
}

/* ---- 搜索防抖 + iOS 输入法组合保护 ---- */
function wcSearchCompStart(){ _wcComposing = true; }
function wcSearchCompEnd(value){
    _wcComposing = false;
    wordCardSearch = value;
    const wrap = document.getElementById('wcSearchWrap');
    if(wrap) wrap.classList.toggle('has-text',!!value);
    clearTimeout(_wcSearchTimer);
    _wcSearchTimer = setTimeout(()=>{ _wcSearchTimer = null; updateWordCardContent(); }, 120);
}
function onWordCardSearch(value){
    wordCardSearch = value;
    const wrap = document.getElementById('wcSearchWrap');
    if(wrap) wrap.classList.toggle('has-text',!!value);
    if(_wcComposing) return;
    clearTimeout(_wcSearchTimer);
    _wcSearchTimer = setTimeout(()=>{ _wcSearchTimer = null; updateWordCardContent(); }, 300);
}
function clearWordCardSearch(){
    clearTimeout(_wcSearchTimer); _wcSearchTimer = null;
    wordCardSearch = '';
    const inp = document.getElementById('wcSearchInput');
    if(inp) inp.value = '';
    const wrap = document.getElementById('wcSearchWrap');
    if(wrap) wrap.classList.remove('has-text');
    updateWordCardContent();
}

function setWordScope(scope){
    clearTimeout(_wcSearchTimer); _wcSearchTimer = null;
    wordCardScope = scope;
    if(scope === 'private') wordCardOwnerId = getScopeContactId();
    wordCardSearch = '';
    renderWordCardPage();
}
function changeWordOwner(id){
    clearTimeout(_wcSearchTimer); _wcSearchTimer = null;
    wordCardOwnerId = id;
    wordCardSearch = '';
    renderWordCardPage();
}

function renderWordCardSearchResults(keyword){
    const kw = keyword.toLowerCase();
    const isShared = wordCardScope === 'shared';
    const ownerId = getScopeContactId();
    const matches = [];
    data.wordCards.groups.forEach(g=>{
        const inScope = isShared ? g.scope==='shared' : (g.scope==='private' && g.ownerId===ownerId);
        if(!inScope) return;
        (g.cards||[]).forEach(c=>{
            if(c && c.word && String(c.word).toLowerCase().indexOf(kw)>=0){
                matches.push({groupId:g.id, groupName:g.name, cardId:c.id, word:c.word, scope:g.scope, groupDisabled:!!g.disabled, cardDisabled:!!c.disabled});
            }
        });
    });
    let html = `<div class="search-result-info"><span>找到 <b>${matches.length}</b> 条结果</span><span>关键词：${escapeHtml(keyword)}</span></div>`;
    if(matches.length === 0) html += `<div class="search-empty"><div style="font-size:36px;opacity:.4;margin-bottom:10px;">🔍</div><div>没有找到包含「${escapeHtml(keyword)}」的字卡</div></div>`;
    else{
        matches.forEach(m=>{
            const hl = escapeHtml(m.word).replace(new RegExp('('+keyword.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>');
            const stateTag = (m.groupDisabled||m.cardDisabled) ? ' <span class="disabled-badge">已停用</span>' : '';
            html += `<div class="search-result-item"><div class="sri-text"><div class="sri-word">${hl}${stateTag}</div><div class="sri-group">分组：<span class="group-chip">📂 ${escapeHtml(m.groupName)}</span></div></div><div class="sri-actions"><button onclick="editCard('${m.groupId}','${m.cardId}')">✎</button><button onclick="deleteCardSearch('${m.groupId}','${m.cardId}')">🗑</button><button onclick="gotoGroup('${m.groupId}')">↗</button></div></div>`;
        });
    }
    return html;
}
function deleteCardSearch(groupId,cardId){
    if(!confirm('删除此字卡？')) return;
    const group = data.wordCards.groups.find(g=>g.id===groupId); if(!group) return;
    group.cards = group.cards.filter(c=>c.id!==cardId); saveData(true);
    updateWordCardContent(); showToast('已删除');
}
function gotoGroup(groupId){
    wordCardSearch = '';
    showGroupDetail(groupId);
}
function dedupeWordCardsUI(){
    let removed = 0;
    const isShared = wordCardScope === 'shared';
    const ownerId = getScopeContactId();
    const seen = new Set();
    data.wordCards.groups.forEach(g=>{
        const inScope = isShared ? g.scope==='shared' : (g.scope==='private' && g.ownerId===ownerId);
        if(!inScope) return;
        if(!Array.isArray(g.cards)) g.cards = [];
        g.cards = g.cards.filter(c=>{
            if(!c || !c.word) return false;
            const key = String(c.word).trim();
            if(!key) return false;
            if(seen.has(key)){removed++;return false;}
            seen.add(key); c.word = key; return true;
        });
    });
    saveData(true);
    updateWordCardContent();
    showToast(removed>0?`🧹 已清理 ${removed} 个重复字卡`:'✅ 没有发现重复字卡');
}
function showAddGroupModal(){
    const scopeLabel = wordCardScope==='shared' ? '共用' : '独立';
    showModal('新建字卡分组', `<label>分组名称</label><input id="modalGroupName" placeholder="输入分组名称" value="默认分组"><div class="setting-sub">当前作用域：${scopeLabel}字卡</div><div class="modal-actions"><button class="btn-cancel" onclick="closeModal()">取消</button><button class="btn-confirm" onclick="confirmAddGroup()">创建</button></div>`);
}
function confirmAddGroup(){
    const name = document.getElementById('modalGroupName').value.trim();
    if(!name){showToast('请输入名称');return;}
    const group = {id:genId(), name, cards:[], scope:wordCardScope, ownerId: wordCardScope==='private'?getScopeContactId():null, disabled:false};
    data.wordCards.groups.push(group); saveData(true); closeModal(); renderWordCardPage(); showToast('分组已创建');
}

/* ---- 分组详情（含批量删除） ---- */
function showGroupDetail(groupId){
    if(_wcBatchGroupId !== groupId){ _wcBatchMode = false; _wcBatchSelected.clear(); _wcBatchGroupId = groupId; }
    const group = data.wordCards.groups.find(g=>g.id===groupId); if(!group) return;
    const body = document.getElementById('wordCardBody'); if(!body) return;
    wordCardSearch = '';

function importWordCards(){
    const input = document.createElement('input'); input.type='file'; input.accept='application/json,.json';
    input.onchange = function(e){
        const file = e.target.files[0]; if(!file) return;
        const reader = new FileReader();
        reader.onload = function(ev){
            try{
                const parsed = JSON.parse(ev.target.result);
                let groups = null;
                if(Array.isArray(parsed)) groups = parsed;
                else if(parsed && Array.isArray(parsed.groups)) groups = parsed.groups;
                else if(parsed && parsed.wordCards && Array.isArray(parsed.wordCards.groups)) groups = parsed.wordCards.groups;
                if(!groups){showToast('⚠️ 文件格式不正确');return;}
                _pendingWCImport = groups;
                showModal('导入字卡', `<div class="setting-sub">文件中包含 <b>${groups.length}</b> 个分组。请选择导入方式：</div><div style="display:flex;flex-direction:column;gap:10px;margin-top:14px;"><button class="btn-primary" style="justify-content:center;" onclick="doImportWC('merge')">➕ 合并到当前作用域</button><button class="btn-danger" style="justify-content:center;" onclick="doImportWC('replace')">🔄 覆盖当前作用域</button><button class="btn-outline" style="justify-content:center;" onclick="closeModal()">取消</button></div><div class="setting-sub" style="margin-top:8px;">当前作用域：${wordCardScope==='shared'?'共用字卡':'当前联系人的独立字卡'}</div>`);
            }catch(err){showToast('⚠️ 数据解析失败');}
        };
        reader.readAsText(file);
    };
    input.click();
}
function doImportWC(mode){
    const groups = _pendingWCImport; if(!groups){closeModal();return;}
    const scope = wordCardScope;
    const ownerId = scope === 'private' ? getScopeContactId() : null;
    if(mode === 'replace'){
        if(!confirm('确定要覆盖当前作用域的全部字卡吗？')) return;
        data.wordCards.groups = data.wordCards.groups.filter(g=>!(g.scope===scope && g.ownerId===ownerId));
        groups.forEach(g=>{
            data.wordCards.groups.push({id:genId(), name:g.name||'未命名分组', scope, ownerId, disabled:false, cards:Array.isArray(g.cards)?g.cards.map(c=>({id:genId(), word:typeof c==='string'?c:(c.word||''), disabled:false})).filter(c=>c.word):[]});
        });
    }else{
        groups.forEach(g=>{
            const name = g.name || '未命名分组';
            const incoming = Array.isArray(g.cards)?g.cards.map(c=>(typeof c==='string'?c:(c.word||''))).filter(Boolean):[];
            let existing = data.wordCards.groups.find(x=>x.name===name && x.scope===scope && x.ownerId===ownerId);
            if(!existing){existing = {id:genId(), name, scope, ownerId, disabled:false, cards:[]};data.wordCards.groups.push(existing);}
            const existedWords = new Set(existing.cards.map(c=>c.word));
            incoming.forEach(w=>{if(!existedWords.has(w)){existing.cards.push({id:genId(),word:w,disabled:false});existedWords.add(w);}});
        });
    }
    saveData(true); closeModal(); renderWordCardPage();
    _pendingWCImport = null; showToast('✅ 字卡导入成功');
}

function dedupeEmojis(){
    const emojis = Array.isArray(data.emojis)?data.emojis:[];
    if(emojis.length===0){showToast('还没有表情');return;}
    const seen = new Set(); const kept = []; let removed = 0;
    emojis.forEach(e=>{
        if(!e) return;
        const key = e.dataUrl ? String(e.dataUrl) : '';
        if(key){if(seen.has(key)){removed++;return;} seen.add(key);}
        kept.push(e);
    });
    if(removed>0){data.emojis=kept;saveData(true);showToast(`🧹 已自动删除 ${removed} 个重复表情`);}
    else showToast('✅ 没有发现重复表情');
    renderEmojiManagePage(); renderEmojiGridPanel();
}
function compressEmojiImage(file,callback){
    try{
        const reader = new FileReader();
        reader.onload = ev=>{
            const raw = ev.target.result; const img = new Image();
            img.onload = ()=>{
                try{
                    let w = img.naturalWidth||img.width, h = img.naturalHeight||img.height;
                    if(!w||!h){callback(raw);return;}
                    const maxDim = 320;
                    if(w>maxDim||h>maxDim){ if(w>h){h=Math.round(h*maxDim/w);w=maxDim;} else{w=Math.round(w*maxDim/h);h=maxDim;} }
                    const c = document.createElement('canvas'); c.width=w; c.height=h;
                    c.getContext('2d').drawImage(img,0,0,w,h);
                    let out = ''; try{out = c.toDataURL('image/webp',0.85);}catch(e){}
                    if(!out || out.indexOf('data:image/webp')!==0) out = c.toDataURL('image/jpeg',0.85);
                    if(out.length > raw.length*0.95) out = raw;
                    callback(out);
                }catch(e){callback(raw);}
            };
            img.onerror = ()=>callback(raw);
            img.src = raw;
        };
        reader.onerror = ()=>callback(null);
        reader.readAsDataURL(file);
    }catch(e){callback(null);}
}
function importEmoji(){
    const input = document.createElement('input'); input.type='file'; input.accept='image/*'; input.multiple=true;
    input.onchange = function(e){
        const files = e.target.files; if(!files||!files.length) return;
        let loaded = 0, added = 0;
        const total = files.length;
        Array.from(files).forEach(file=>{
            compressEmojiImage(file, dataUrl=>{
                if(dataUrl){data.emojis.push({id:genId(),dataUrl});added++;}
                loaded++;
                if(loaded === total){saveData(true);renderEmojiManagePage();renderEmojiGridPanel();showToast(`已导入 ${added} 个表情`);}
            });
        });
    };
    input.click();
}

function addTextEmoji(){
    const input = document.getElementById('newTextEmojiInput'); if(!input) return;
    const val = input.value.trim(); if(!val){showToast('请输入内容');return;}
    if(!Array.isArray(data.textEmojis)) data.textEmojis = [];
    const items = val.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
    const existing = new Set(data.textEmojis.map(e=>e.text));
    let added = 0;
    items.forEach(t=>{if(existing.has(t))return;data.textEmojis.push({id:genId(),text:t});existing.add(t);added++;});
    saveData(true); renderTextEmojiPage();
    showToast(added>0?`已添加 ${added} 条`:'内容已存在');
}
function deleteTextEmoji(id){if(!confirm('删除这条内容？')) return;data.textEmojis=(data.textEmojis||[]).filter(e=>e.id!==id);saveData(true);renderTextEmojiPage();showToast('已删除');}
function clearAllTextEmoji(){if(!confirm('确定要清空所有颜文字 / Emoji 吗？')) return;data.textEmojis=[];saveData(true);renderTextEmojiPage();showToast('已清空');}
function showBatchAddTextEmoji(){
    showModal('批量导入颜文字 / Emoji','<label>每行一条</label><textarea id="batchTextEmojiInput" rows="8" placeholder="(๑•̀ㅂ•́)و✧&#10;( ˘ ³˘)♥&#10;😊&#10;✨"></textarea><div class="setting-sub">重复的内容会自动跳过</div><div class="modal-actions"><button class="btn-cancel" onclick="closeModal()">取消</button><button class="btn-confirm" onclick="confirmBatchAddTextEmoji()">导入</button></div>');
}
function confirmBatchAddTextEmoji(){
    const ta = document.getElementById('batchTextEmojiInput'); if(!ta) return;
    const list = ta.value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
    if(list.length === 0){showToast('请输入内容');return;}
    if(!Array.isArray(data.textEmojis)) data.textEmojis = [];
    const existing = new Set(data.textEmojis.map(e=>e.text));
    let added = 0, skipped = 0;
    list.forEach(t=>{if(existing.has(t)){skipped++;return;}data.textEmojis.push({id:genId(),text:t});existing.add(t);added++;});
    saveData(true); closeModal(); renderTextEmojiPage();
    showToast(`新增 ${added} 条，跳过 ${skipped} 条（重复）`);
}

function renderPatSettings(){
    const body = document.getElementById('patSettingsBody'); if(!body) return;
    const pat = data.patSettings || {probability:0.03, contents:[]};
    if(!Array.isArray(pat.contents)) pat.contents = [];
    const probPercent = Math.round((Number(pat.probability)||0)*100);
    let contentHtml = '';
    pat.contents.forEach((c,idx)=>{contentHtml += `<div class="word-card-item"><span class="card-word">👋 ${escapeHtml(c)}</span><div class="card-actions"><button onclick="editPatContent(${idx})">✎</button><button onclick="deletePatContent(${idx})">🗑</button></div></div>`;});
    if(!contentHtml) contentHtml = '<div class="empty-state"><div class="empty-icon">👋</div><div>还没有拍一拍内容</div></div>';
    body.innerHTML = `<div class="setting-item"><span class="label">对方拍一拍概率</span><div class="value"><input type="number" value="${probPercent}" min="0" max="100" style="width:64px;" onchange="updatePatProb(this.value)"><span>%</span></div></div><div class="setting-sub">每次对方回复后，有该概率触发一次拍一拍</div><div style="margin-top:14px;"><div style="display:flex;gap:8px;margin-bottom:8px;"><input id="newPatContent" placeholder="输入拍一拍内容" style="flex:1;padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:var(--bg);color:var(--text);outline:none;"><button class="btn-primary" onclick="addPatContent()">添加</button></div><div style="display:flex;gap:8px;margin-bottom:12px;"><button class="btn-outline" style="flex:1;justify-content:center;" onclick="showBatchAddPat()">📥 批量添加</button>${pat.contents.length>0?'<button class="btn-danger" style="flex:1;justify-content:center;" onclick="clearAllPat()">🗑 清空全部</button>':''}</div>${contentHtml}</div>`;
}
function updatePatProb(val){const p=parseFloat(val);if(isNaN(p)||p<0)return;data.patSettings.probability=Math.min(p/100,1);saveData(true);showToast('已更新');}
function addPatContent(){
    const input = document.getElementById('newPatContent');
    const val = input.value.trim(); if(!val){showToast('请输入内容');return;}
    const list = val.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
    let added = 0;
    list.forEach(item=>{if(!data.patSettings.contents.includes(item)){data.patSettings.contents.push(item);added++;}});
    saveData(true); renderPatSettings();
    showToast(added>1?`已添加 ${added} 条拍一拍`:'已添加');
}
function showBatchAddPat(){showModal('批量添加拍一拍','<label>每行一条</label><textarea id="batchPatInput" rows="8" placeholder="拍了拍你的头&#10;戳了戳你&#10;捏了捏你的脸"></textarea><div class="setting-sub">重复的内容会自动跳过</div><div class="modal-actions"><button class="btn-cancel" onclick="closeModal()">取消</button><button class="btn-confirm" onclick="confirmBatchAddPat()">添加</button></div>');}
function confirmBatchAddPat(){
    const ta = document.getElementById('batchPatInput'); if(!ta) return;
    const list = ta.value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
    if(list.length === 0){showToast('请输入内容');return;}
    let added = 0, skipped = 0;
    list.forEach(item=>{if(data.patSettings.contents.includes(item)){skipped++;return;}data.patSettings.contents.push(item);added++;});
    saveData(true); closeModal(); renderPatSettings();
    showToast(`新增 ${added} 条，跳过 ${skipped} 条（重复）`);
}
function clearAllPat(){if(!confirm('确定要清空所有拍一拍内容吗？')) return;data.patSettings.contents=[];saveData(true);renderPatSettings();showToast('已清空');}
function deletePatContent(idx){if(!confirm('删除这条拍一拍内容？')) return;data.patSettings.contents.splice(idx,1);saveData(true);renderPatSettings();showToast('已删除');}
function editPatContent(idx){const old=data.patSettings.contents[idx];const nv=prompt('编辑拍一拍内容：',old);if(nv!==null&&nv.trim()){data.patSettings.contents[idx]=nv.trim();saveData(true);renderPatSettings();showToast('已更新');}}

function openPatInput(){const m=document.getElementById('patInputModal');if(m)m.style.display='flex';document.getElementById('patCustomInput').focus();closeEmojiPanel();}
function closePatInput(){const m=document.getElementById('patInputModal');if(m)m.style.display='none';const ta=document.getElementById('patCustomInput');if(ta)ta.value='';}
function sendCustomPat(){
    const ta = document.getElementById('patCustomInput');

function scheduleAutoMessage(){
    scheduler.cancelByKey('autoMsg');
    scheduler.tasks = scheduler.tasks.filter(t=>!(t.key && String(t.key).indexOf('autoMsg_')===0));
    if(!data.replySettings.autoMsgEnabled) return;
    data.contacts.forEach(c=>{ if(isGroup(c)) return; scheduleAutoMessageFor(c.id); });
}
function scheduleAutoMessageFor(contactId){
    scheduler.cancelByKey('autoMsg_'+contactId);
    if(!data.replySettings.autoMsgEnabled) return;
    const c = getContact(contactId);
    if(!c || isGroup(c)) return;
    const s = data.replySettings;
    let minM=Number(s.autoMsgMinMinutes),maxM=Number(s.autoMsgMaxMinutes);
    if(isNaN(minM)||minM<0.1) minM=5;
    if(isNaN(maxM)||maxM<0.1) maxM=30;
    if(maxM<minM){const t=minM;minM=maxM;maxM=t;}
    const delay=(minM+Math.random()*(maxM-minM))*60000;
    scheduler.add(()=>{ sendPartnerAutoMessage(contactId); scheduleAutoMessageFor(contactId); },delay,'autoMsg_'+contactId);
}
function sendPartnerAutoMessage(contactId){
    const c = contactId ? getContact(contactId) : getActiveContact();
    if(!c || isGroup(c)) return;
    const cid = c.id;
    const s=data.replySettings;
    let minC=Number(s.autoMsgMinCount),maxC=Number(s.autoMsgMaxCount);
    if(isNaN(minC)||minC<1)minC=1;
    if(isNaN(maxC)||maxC<1)maxC=3;
    if(maxC<minC){const t=minC;minC=maxC;maxC=t;}
    minC=Math.round(minC);maxC=Math.round(maxC);
    const count=clamp(randInt(minC,maxC),1,20);
    const cards=getCardsForContact(c);
    const emojiProb=Number(s.emojiReplyProbability)||0;
    const hasEmoji=Array.isArray(data.emojis)&&data.emojis.length>0;
    const teList=Array.isArray(data.textEmojis)?data.textEmojis:[];
    const teOn=!!s.textEmojiEnabled&&teList.length>0;
    let teProb=Number(s.textEmojiProbability);if(isNaN(teProb))teProb=0.2;
    const willTextEmoji=teOn&&Math.random()<teProb;
    const teText=willTextEmoji?pickTextEmoji():'';
    const teWithCard=s.textEmojiWithCard!==false;
    if(willTextEmoji&&!teWithCard){
        showTypingIndicator(cid);
        scheduler.add(()=>{hideTypingIndicator(cid);addMessage('partner',teText,'text',null,false,true,'',cid);afterPartnerReply(cid);},800+Math.random()*600,'autoMsgTextEmoji_'+cid);
        return;
    }
    const msgs=[];
    for(let i=0;i<count;i++){
        if(cards.length>0&&Math.random()<0.7) msgs.push({type:'text',content:cards[Math.floor(Math.random()*cards.length)]});
        else{const fb=['在吗？','在干嘛呢','想你了','吃饭了吗？','今天过得怎么样？','嘿嘿','有空吗～'];msgs.push({type:'text',content:fb[Math.floor(Math.random()*fb.length)]});}
    }
    if(willTextEmoji&&teText) msgs.push({type:'text',content:teText});
    if(hasEmoji&&Math.random()<emojiProb){const emoji=data.emojis[Math.floor(Math.random()*data.emojis.length)];msgs.push({type:'emoji',content:emoji.dataUrl});}
    showTypingIndicator(cid);
    const step=Math.max(350,Math.min(800,Math.round(2800/Math.max(1,msgs.length))));
    msgs.forEach((m,index)=>{
        scheduler.add(()=>{
            if(index===0) hideTypingIndicator(cid);
            addMessage('partner',m.content,m.type,null,false,true,'',cid);
            if(index===msgs.length-1) afterPartnerReply(cid);
        },800+index*step,'autoMsgSend_'+cid+'_'+index);
    });
}

function answerCall(){

    const onStart=e=>{const pt=getPoint(e),rect=mini.getBoundingClientRect();drag={offsetX:pt.clientX-rect.left,offsetY:pt.clientY-rect.top,startX:pt.clientX,startY:pt.clientY,moved:false};mini.classList.add('dragging');if(e.cancelable)e.preventDefault();};
    const onMove=e=>{if(!drag)return;const pt=getPoint(e);if(Math.abs(pt.clientX-drag.startX)>5||Math.abs(pt.clientY-drag.startY)>5)drag.moved=true;const x=pt.clientX-drag.offsetX,y=pt.clientY-drag.offsetY;const w=mini.offsetWidth,h=mini.offsetHeight;const maxX=Math.max(0,window.innerWidth-w),maxY=Math.max(0,window.innerHeight-h);mini.style.left=Math.max(0,Math.min(maxX,x))+'px';mini.style.top=Math.max(0,Math.min(maxY,y))+'px';mini.style.right='auto';mini.style.bottom='auto';if(e.cancelable)e.preventDefault();};
    const onEnd=()=>{if(!drag)return;const moved=drag.moved;drag=null;mini.classList.remove('dragging');if(!moved)restoreCall();};
    mini.addEventListener('touchstart',onStart,{passive:false});

function compressImageFile(file,maxDim,quality){
    return new Promise(resolve=>{
        try{
            const reader=new FileReader();
            reader.onload=ev=>{
                const raw=ev.target.result,img=new Image();
                img.onload=()=>{
                    try{
                        let w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;
                        if(!w||!h){resolve(raw);return;}
                        if(w>maxDim||h>maxDim){if(w>h){h=Math.round(h*maxDim/w);w=maxDim;}else{w=Math.round(w*maxDim/h);h=maxDim;}}
                        const c=document.createElement('canvas');c.width=w;c.height=h;
                        c.getContext('2d').drawImage(img,0,0,w,h);
                        resolve(c.toDataURL('image/jpeg',quality));
                    }catch(e){resolve(raw);}
                };
                img.onerror=()=>resolve(raw);img.src=raw;
            };
            reader.onerror=()=>resolve(null);reader.readAsDataURL(file);
        }catch(e){resolve(null);}
    });
}

function seekMusic(e){
    const a=getMusicAudio();if(!a||!a.duration||!isFinite(a.duration))return;
    const bar=document.getElementById('musicProgress');if(!bar)return;
    const rect=bar.getBoundingClientRect();
    const clientX=(e.touches&&e.touches[0])?e.touches[0].clientX:e.clientX;
    const ratio=Math.max(0,Math.min(1,(clientX-rect.left)/rect.width));
    a.currentTime=ratio*a.duration;updateMusicProgress();
}
function readFileAsDataURL(file){return new Promise(resolve=>{try{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>resolve(null);r.readAsDataURL(file);}catch(e){resolve(null);}});}
function getMusicFileInput(){
    if(_musicFileInput)return _musicFileInput;
    const input=document.createElement('input');input.type='file';input.accept='audio/*';input.multiple=true;
    input.style.cssText='position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0;pointer-events:none;';
    document.body.appendChild(input);
    input.addEventListener('change',async function(e){
        const files=Array.from(e.target.files||[]);if(!files.length){input.value='';return;}
        showToast(`正在读取 ${files.length} 个文件...`);
        let added=0,skipped=0;
        for(const file of files){
            if(file.size>8*1024*1024){skipped++;continue;}
            const dataUrl=await readFileAsDataURL(file);
            if(!dataUrl){skipped++;continue;}
            const name=file.name.replace(/\.[^.]+$/,'')||'本地音乐';
            data.music.list.push({id:genId(),name,artist:'',url:dataUrl,neteaseId:'',source:'file'});
            added++;
        }
        saveData(true);if(musicPanelOpen)renderMusicPage();input.value='';
        if(added)showToast(`已添加 ${added} 首${skipped?`，跳过 ${skipped} 首（过大）`:''}`);
        else showToast('未能添加音乐'+(skipped?'（文件过大）':''));
    });
    _musicFileInput=input;return input;
}

function confirmMusicLinks(){
    const ta=document.getElementById('musicLinkInput');if(!ta)return;
    const lines=ta.value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
    if(!lines.length){showToast('请输入内容');return;}
    closeModal();
    let added=0,failed=0,dup=0;

        const parsed=parseMusicLink(line);
        if(!parsed){failed++;continue;}
        const isDup=data.music.list.some(x=>(parsed.source==='netease'&&x.source==='netease'&&x.neteaseId===parsed.neteaseId)||(parsed.source==='link'&&x.source==='link'&&x.url===parsed.url));
        if(isDup){dup++;continue;}
        data.music.list.push({id:genId(),name:parsed.name,artist:'',url:parsed.url||'',neteaseId:parsed.neteaseId||'',source:parsed.source});
        added++;
    }
    saveData(true);if(musicPanelOpen)renderMusicPage();
    let msg=`成功添加 ${added} 条`;if(dup)msg+=`，重复 ${dup} 条`;if(failed)msg+=`，格式错误 ${failed} 条`;

function testNeteasePlayable(id){
    return new Promise(resolve=>{
        const a=new Audio();a.preload='metadata';let settled=false;
        const done=ok=>{if(settled)return;settled=true;try{a.pause();a.removeAttribute('src');a.load();}catch(e){}resolve(ok);};
        a.addEventListener('canplay',()=>done(true),{once:true});
        a.addEventListener('loadedmetadata',()=>done(true),{once:true});
        a.addEventListener('error',()=>done(false),{once:true});
        setTimeout(()=>done(false),4000);
        try{a.src=`https://music.163.com/song/media/outer/url?id=${id}.mp3`;a.load();}catch(e){done(false);}
    });
}
async function removeVipMusic(){
    const ns=data.music.list.filter(s=>s.source==='netease'&&s.neteaseId);
    if(!ns.length){showToast('没有网易云歌曲');return;}
    if(!confirm(`将检测并删除无法播放的会员/付费歌曲，共 ${ns.length} 首，确定继续？`))return;
    showToast('正在检测，请稍候...');
    const toRemove=new Set();
    for(const song of ns){const ok=await testNeteasePlayable(song.neteaseId);if(!ok)toRemove.add(song.id);}
    if(toRemove.size===0){showToast('没有发现无法播放的歌曲');return;}
    const curId=(data.music.currentIndex>=0&&data.music.list[data.music.currentIndex])?data.music.list[data.music.currentIndex].id:null;
    data.music.list=data.music.list.filter(s=>!toRemove.has(s.id));
    if(curId&&toRemove.has(curId)){silentPauseAudio();data.music.currentIndex=-1;}
    else if(curId)data.music.currentIndex=data.music.list.findIndex(s=>s.id===curId);
    saveData(true);if(musicPanelOpen)renderMusicPage();
    showToast(`已删除 ${toRemove.size} 首无法播放的歌曲`);
}

function maybeMusicInteraction(){

function todayKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function ensureLetterDailyReset(){
    if(!data.letters||!data.letters.settings)return;
    const s=data.letters.settings,today=todayKey();
    if(s.dailyResetDate!==today){s.dailyResetDate=today;if(s.dailyLimitMode==='random')s.dailyLimitValue=Math.floor(Math.random()*4);s.dailyWriteCount=0;saveData();}
}
function openLetter(){
    closePlusMenu();
    const panel=document.getElementById('letterPanel');if(!panel)return;
    ensureLetterDailyReset();
    const singles = data.contacts.filter(c=>!isGroup(c));
    if(singles.length){
        if(data.activeContactId && singles.some(c=>c.id===data.activeContactId)){
            letterSelectedContactId = data.activeContactId;
        } else if(!letterSelectedContactId || !singles.some(c=>c.id===letterSelectedContactId)){
            letterSelectedContactId = singles[0].id;
        }
    } else {
        letterSelectedContactId = null;
    }
    letterPanelOpen=true;
    panel.classList.add('open');
    renderLetterPage();
}
function closeLetter(){const panel=document.getElementById('letterPanel');if(panel)panel.classList.remove('open');letterPanelOpen=false;}
function letterCycleContact(dir){
    const singles = data.contacts.filter(c=>!isGroup(c));
    if(singles.length < 2){
        if(singles.length === 1 && letterSelectedContactId !== singles[0].id){
            letterSelectedContactId = singles[0].id;
            renderLetterPage();
        }
        return;
    }
    let idx = singles.findIndex(c=>c.id===letterSelectedContactId);
    if(idx < 0) idx = 0;
    idx = (idx + dir + singles.length) % singles.length;
    letterSelectedContactId = singles[idx].id;
    renderLetterPage();
}
function letterSwitchContact(id){
    if(!id) return;
    if(letterSelectedContactId === id) return;
    letterSelectedContactId = id;

function updateLetterSetting(key,val){
    const n=parseFloat(val);if(isNaN(n))return;
    const s=data.letters.settings;
    if(key==='cardMin'||key==='cardMax'||key==='dailyLimitValue')s[key]=Math.max(0,Math.round(n));
    else s[key]=Math.max(0.1,n);
    saveData(true);renderLetterPage();
}
function updateLetterProb(key,val){const n=parseFloat(val);if(isNaN(n))return;data.letters.settings[key]=Math.min(Math.max(n/100,0),1);saveData(true);showToast('已更新');}
function toggleLetterAuto(){data.letters.settings.partnerAutoEnabled=!data.letters.settings.partnerAutoEnabled;saveData(true);renderLetterPage();showToast(data.letters.settings.partnerAutoEnabled?'已开启对方主动写信':'已关闭对方主动写信');}
function openLetterCompose(){
    if(!letterSelectedContactId){showToast('请先选择联系人');return;}

}
function confirmComposeLetter(){
    if(!letterSelectedContactId){showToast('请先选择联系人');return;}
    const ta=document.getElementById('letterComposeInput');
    const content=ta?ta.value.trim():'';

    data.letters.list.unshift(letter);if(data.letters.list.length>200)data.letters.list=data.letters.list.slice(0,200);
    saveData(true);closeModal();renderLetterPage();updateLetterMenuDot();
    showToast('✉️ 信已寄出');schedulePartnerReplyLetter(letter.id);
}
function schedulePartnerReplyLetter(letterId){
    const L=data.letters,s=L.settings;
    let prob=Number(s.replyProbability);if(isNaN(prob))prob=0;
    if(Math.random()>=prob)return;
    let maxM=Number(s.replyMaxMinutes);if(isNaN(maxM)||maxM<0.1)maxM=60;
    const delayMs=Math.random()*maxM*60000;
    scheduler.add(()=>{
        const letter=L.list.find(x=>x.id===letterId);
        if(!letter||letter.reply)return;
        const cards=getAllCards();
        let minC=Math.max(1,Math.round(Number(s.cardMin)||1));
        let maxC=Math.max(1,Math.round(Number(s.cardMax)||3));
        if(maxC<minC){const t=minC;minC=maxC;maxC=t;}
        const count=clamp(randInt(minC,maxC),1,30);
        let content='';
        if(cards.length===0)content='（没有字卡可回…）';
        else{const sh=cards.slice();for(let i=sh.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[sh[i],sh[j]]=[sh[j],sh[i]];}content=sh.slice(0,count).join('\n');}
        letter.reply={content,timestamp:Date.now()};letter.hasNew=true;letter.badge='sparkle';
        saveData(true);updateLetterMenuDot();
        if(letterPanelOpen)renderLetterPage();
        playNotifySound();showSystemNotification({content:'✨ 对方回信了',type:'text'});
    },delayMs,'partnerLetterReply_'+letterId);
}
function maybePartnerWriteLetter(){
    const L=data.letters;if(!L||!L.settings)return;
    const s=L.settings;
    if(!s.partnerAutoEnabled)return;
    if(callState&&callState.active)return;
    ensureLetterDailyReset();
    if(s.dailyWriteCount>=s.dailyLimitValue)return;
    let prob=Number(s.autoProbability);if(isNaN(prob))prob=0;
    if(Math.random()>=prob)return;
    let minM=Number(s.writeMinMinutes),maxM=Number(s.writeMaxMinutes);
    if(isNaN(minM)||minM<0.1)minM=5;
    if(isNaN(maxM)||maxM<0.1)maxM=30;
    if(maxM<minM){const t=minM;minM=maxM;maxM=t;}
    const delayMs=(minM+Math.random()*(maxM-minM))*60000;
    const singles = data.contacts.filter(x=>!isGroup(x));
    let target = getActiveContact();
    if(!target || isGroup(target)) target = singles.length ? singles[Math.floor(Math.random()*singles.length)] : null;
    const targetId = target ? target.id : null;
    scheduler.add(()=>{ensureLetterDailyReset();if(s.dailyWriteCount>=s.dailyLimitValue)return;writePartnerLetter(targetId);},delayMs,'partnerLetterWrite');
}
function writePartnerLetter(contactId){
    const L=data.letters,s=L.settings;
    const cards=getAllCards();
    let minC=Math.max(1,Math.round(Number(s.cardMin)||1));
    let maxC=Math.max(1,Math.round(Number(s.cardMax)||3));
    if(maxC<minC){const t=minC;minC=maxC;maxC=t;}
    const count=clamp(randInt(minC,maxC),1,30);
    let content='';
    if(cards.length===0)content='（今天没有字卡可写…）';
    else{const sh=cards.slice();for(let i=sh.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[sh[i],sh[j]]=[sh[j],sh[i]];}content=sh.slice(0,count).join('\n');}
    const letter={id:genId(),from:'partner',content,timestamp:Date.now(),reply:null,hasNew:true,badge:'heart',contactId:contactId||null};
    L.list.unshift(letter);if(L.list.length>200)L.list=L.list.slice(0,200);
    s.dailyWriteCount++;saveData(true);updateLetterMenuDot();
    if(letterPanelOpen)renderLetterPage();
    playNotifySound();showSystemNotification({content:'💌 对方给你写了一封信',type:'text'});
}
function openLetterReader(letterId){

    const pc = letter.contactId ? getContact(letter.contactId) : null;

function openReplyLetter(letterId){

function drawDivination(){
    const ta=document.getElementById('divQuestionInput');
    const q=ta?ta.value.trim():'';
    if(!q){showToast('请先写下你的问题');if(ta)ta.focus();return;}
    divQuestion=q;const cards=[];

    else{const pool=LENORMAND_DECK.slice();for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}pool.slice(0,3).forEach(c=>cards.push({name:c.n,icon:c.e,reversed:false}));}

function copyDivination(){

}
function fallbackCopy(txt){
    const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.left='-9999px';
    document.body.appendChild(ta);ta.select();
    try{const ok=document.execCommand('copy');showToast(ok?'✅ 已复制到剪贴板':'复制失败');}catch(e){showToast('复制失败');}
    document.body.removeChild(ta);
}

function ensureClockCards(){
    if(!data.clockCards||typeof data.clockCards!=='object')data.clockCards={place:[],action:[]};
    if(!Array.isArray(data.clockCards.place))data.clockCards.place=[];
    if(!Array.isArray(data.clockCards.action))data.clockCards.action=[];
    return data.clockCards;
}
function getClockCards(direction,contactId){
    ensureClockCards();
    const arr=direction==='place'?data.clockCards.place:data.clockCards.action;
    return arr.filter(c=>{if(c.scope==='shared')return true;if(c.scope==='private'&&c.ownerId===contactId)return true;return false;}).filter(c=>c&&c.word).map(c=>({word:c.word,id:c.id,scope:c.scope,ownerId:c.ownerId}));
}
function shuffleArray(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
function clearClockTimers(){(clockState.timers||[]).forEach(t=>{try{clearTimeout(t);}catch(e){}});clockState.timers=[];}
function addClockTimer(t){clockState.timers.push(t);return t;}

function openClock(){
    closePlusMenu();
    ensureClockCards();
    const panel=document.getElementById('clockPanel');if(!panel)return;
    clearClockTimers();

function closeClock(){clearClockTimers();const panel=document.getElementById('clockPanel');if(panel)panel.classList.remove('open');clockState.open=false;}
function renderClockPage(){

function renderClockHome(body){

}
function clockChooseDirection(dir){
    clockState.direction=dir;

    setTimeout(()=>{const sel=document.getElementById('clockTargetSelect');if(sel&&data.activeContactId&&singles.some(c=>c.id===data.activeContactId))sel.value=data.activeContactId;},50);

function clockConfirmTarget(){
    const sel=document.getElementById('clockTargetSelect');

    if(!contactId){showToast('请选择联系人');return;}
    const c=getContact(contactId);if(!c){showToast('联系人不存在');return;}

    if(cards.length===0){closeModal();showToast('该方向还没有可用查岗字卡');clockState.cardDir=clockState.direction;clockState.clockOwnerId=contactId;clockState.stage='cards';renderClockPage();return;}

}
function startClockConnection(){
    clockState.stage='connecting';clockState.connectionResult=null;renderClockPage();
    const t=setTimeout(()=>{const rand=Math.random();let result;if(rand<0.35)result='success';else if(rand<0.55)result='unstable';else if(rand<0.78)result='busy';else result='refused';clockState.connectionResult=result;renderClockPage();},2000);
    addClockTimer(t);
}
function renderClockConnecting(body){
    if(!clockState.connectionResult){body.innerHTML=`<div class="clock-connecting"><div class="clock-spinner"></div><div class="clock-connecting-text">正在连接对方中……</div><div class="clock-connecting-sub">目标：${escapeHtml(clockState.targetName)}</div></div>`;return;}
    const r=clockState.connectionResult;
    const map={success:{icon:'✅',text:'连接成功',cls:'success'},unstable:{icon:'📶',text:'链接不稳',cls:'unstable'},busy:{icon:'⏳',text:'对方正在忙',cls:'busy'},refused:{icon:'🚫',text:'对方拒绝连接',cls:'refused'}};
    const info=map[r];
    const canNext=(r==='success'||r==='unstable');
    body.innerHTML=`<div class="clock-result-box ${info.cls}"><div class="clock-result-icon">${info.icon}</div><div class="clock-result-text">${info.text}</div>${canNext?`<button class="btn-primary" style="margin-top:26px;padding:12px 40px;" onclick="clockStartDraw()">开始查询</button>`:`<button class="btn-outline" style="margin-top:26px;padding:12px 40px;color:#fff;border-color:rgba(255,255,255,.3);" onclick="clockBackHome()">返回</button>`}</div>`;
}
function clockBackHome(){
    clearClockTimers();
    clockState.stage='home';clockState.direction=null;clockState.connectionResult=null;
    clockState.firstCard=null;clockState.verifyCards=[];clockState.verifyStage=null;
    clockState.autoPickIdx=-1;clockState.retryCount=0;clockState.cardDir=null;clockState.clockOwnerId=null;

function clockStartDraw(){

}
function renderClockShuffle(body,text){body.innerHTML=`<div class="clock-shuffle"><div class="clock-card-stack"><div class="clock-card-back"></div><div class="clock-card-back"></div><div class="clock-card-back"></div></div><div class="clock-shuffle-text">${escapeHtml(text||'正在洗牌……')}</div></div>`;}
function renderClockDrawing(body){

    body.innerHTML=`<div class="clock-draw-area"><div class="clock-card-wrap"><div class="clock-card" id="clockResultCard">⭐</div></div><button class="btn-primary" style="padding:12px 40px;" id="clockRevealBtn" onclick="clockRevealCard()">点击查看</button></div>`;
}
function clockRevealCard(){
    const cardEl=document.getElementById('clockResultCard');

function showClockVerifyPrompt(){
    const firstWord=clockState.firstCard?clockState.firstCard.word:'';
    showModal('🔍 二次验证',`<div class="clock-first-ref" style="margin-bottom:14px;">你这次抽到的牌：<b>${escapeHtml(firstWord)}</b></div><div style="text-align:center;padding:6px 0 8px;font-size:16px;font-weight:600;">是否进行二次验证？</div><div class="setting-sub" style="text-align:center;margin-bottom:6px;">二次验证由系统自动帮你抽牌</div><div class="modal-actions"><button class="btn-cancel" onclick="closeModal()">取消</button><button class="btn-confirm" onclick="clockStartVerify()">确认</button></div>`);
}
function clockStartVerify(){
    closeModal();
    const cards=getClockCards(clockState.direction,clockState.targetContactId);
    if(cards.length<3){showModal('提示','<div style="text-align:center;padding:12px 0 16px;">该方向的查岗字卡不足 3 张，无法进行二次验证</div><div class="modal-actions"><button class="btn-confirm" onclick="closeModal();clockBackHome();">知道了</button></div>');return;}
    if(!clockState.firstCard){showToast('数据异常，请重新查询');clockBackHome();return;}
    const others=cards.filter(x=>x.id!==clockState.firstCard.id);
    shuffleArray(others);
    const two=others.slice(0,2);
    const three=[clockState.firstCard,...two];
    shuffleArray(three);
    clockState.verifyCards=three;clockState.verifyStage=null;clockState.autoPickIdx=-1;clockState.stage='verify';
    renderClockPage();
    const t=setTimeout(()=>{
        clockState.verifyStage='pick';renderClockPage();
        const t2=setTimeout(()=>{if(!clockState.open||clockState.stage!=='verify'||!clockState.verifyCards.length)return;const idx=Math.floor(Math.random()*clockState.verifyCards.length);clockAutoPickVerifyCard(idx);},1500);
        addClockTimer(t2);
    },1600);
    addClockTimer(t);
}
function renderClockVerifyPick(body){
    const firstWord=clockState.firstCard?clockState.firstCard.word:'';
    let html='<div class="clock-verify-title">系统正在自动验证…</div>';
    if(firstWord)html+=`<div class="clock-verify-first-wrap"><div class="clock-verify-first">你之前抽到的牌：<b>${escapeHtml(firstWord)}</b></div></div>`;
    html+='<div class="clock-verify-cards">';
    clockState.verifyCards.forEach((c,i)=>{const picked=clockState.autoPickIdx===i;html+=`<div class="clock-verify-card${picked?' picked':''}" data-vid="${i}">${picked?escapeHtml(c.word):'⭐'}</div>`;});
    html+='</div>';
    html+=`<div class="clock-auto-tip">${clockState.autoPickIdx>=0?'正在比对验证结果……':'无需手动选择，系统会自动从这 3 张牌中抽出 1 张进行验证'}</div>`;
    body.innerHTML=html;
}
function clockAutoPickVerifyCard(idx){
    const picked=clockState.verifyCards[idx];
    if(!picked||!clockState.firstCard)return;
    clockState.autoPickIdx=idx;renderClockPage();
    const isMatch=picked.id===clockState.firstCard.id;
    const firstWord=clockState.firstCard.word;
    const t=setTimeout(()=>{
        if(isMatch){
            showModal('✅ 验证成功',`<div class="clock-first-ref">你之前抽到的牌：<b>${escapeHtml(firstWord)}</b></div><div class="clock-picked-card">${escapeHtml(picked.word)}</div><div class="clock-picked-hint" style="color:#10b981;">系统自动验证结果与首次一致，可信度较高</div><div class="modal-actions"><button class="btn-confirm" onclick="closeModal();clockBackHome();">完成</button></div>`);
        }else{
            clockState.retryCount++;
            const isFinal=clockState.retryCount>=2;
            if(isFinal){showModal('😔 验证失败',`<div class="clock-first-ref">你之前抽到的牌：<b>${escapeHtml(firstWord)}</b></div><div class="clock-picked-card">${escapeHtml(picked.word)}</div><div class="clock-picked-hint" style="color:#ef4444;font-weight:600;">系统自动验证两次均不一致，对方可能在忙，请稍后重试</div><div class="modal-actions"><button class="btn-confirm" onclick="closeModal();clockBackHome();">知道了</button></div>`);}
            else{showModal('🤔 验证不一致',`<div class="clock-first-ref">你之前抽到的牌：<b>${escapeHtml(firstWord)}</b></div><div class="clock-picked-card">${escapeHtml(picked.word)}</div><div class="clock-picked-hint">系统自动验证结果与首次不一致，是否重新验证一次？</div><div class="modal-actions"><button class="btn-cancel" onclick="closeModal();clockBackHome();">取消</button><button class="btn-confirm" onclick="clockRetry()">重新验证</button></div>`);}
        }
    },700);
    addClockTimer(t);
}
function clockRetry(){closeModal();const cards=getClockCards(clockState.direction,clockState.targetContactId);if(cards.length===0){showToast('该方向还没有可用查岗字卡');clockBackHome();return;}clockStartDraw();}

function openClockCardSetting(direction){
    ensureClockCards();
    clockState.cardDir=direction;
    if(clockState.clockOwnerId==null){const c=getActiveContact();clockState.clockOwnerId = (c && !isGroup(c)) ? c.id : (data.contacts.filter(x=>!isGroup(x))[0]?.id || null);}
    clockState.stage='cards';
    renderClockPage();
}
function clockCardsBack(){clockState.stage='home';clockState.cardDir=null;renderClockPage();}
function setClockScope(scope){clockScope=scope;renderClockCardsManage(document.getElementById('clockBody'));}
function changeClockOwner(id){clockState.clockOwnerId=id;renderClockCardsManage(document.getElementById('clockBody'));}
function renderClockCardsManage(body){
    ensureClockCards();
    const dir=clockState.cardDir||'place';
    const isPlace=dir==='place';
    const singles=data.contacts.filter(c=>!isGroup(c));
    let ownerId=clockState.clockOwnerId;
    if(clockScope==='private'){if(!ownerId){const c=getActiveContact();ownerId=(c && !isGroup(c))?c.id:(singles[0]?singles[0].id:null);clockState.clockOwnerId=ownerId;}}
    const allList=isPlace?data.clockCards.place:data.clockCards.action;
    const list=allList.filter(x=>{if(x.scope==='shared')return true;if(x.scope==='private'&&x.ownerId===ownerId)return true;return false;});
    const title=isPlace?'📍 位置字卡':'🎯 干什么字卡';
    let html='';
    html+=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;"><button class="btn-outline" style="color:#fff;border-color:rgba(255,255,255,.3);" onclick="clockCardsBack()">‹ 返回</button><span style="font-weight:600;font-size:15px;">${title}</span><span style="margin-left:auto;font-size:12px;opacity:.6;">共 ${list.length} 张</span></div>`;
    html+=`<div style="display:flex;gap:6px;margin-bottom:12px;"><button class="wc-scope-btn ${clockScope==='shared'?'active':''}" onclick="setClockScope('shared')" style="${clockScope==='shared'?'background:#8B5CF6;':'background:rgba(255,255,255,.1);'}">公共</button><button class="wc-scope-btn ${clockScope==='private'?'active':''}" onclick="setClockScope('private')" style="${clockScope==='private'?'background:#8B5CF6;':'background:rgba(255,255,255,.1);'}">独立</button></div>`;
    if(clockScope==='private'){
        if(singles.length===0){html+=`<div style="text-align:center;padding:20px;color:rgba(255,255,255,.5);">还没有联系人，无法创建独立字卡</div>`;}
        else{let opts=singles.map(c=>`<option value="${c.id}" ${c.id===ownerId?'selected':''}>${escapeHtml(c.name)}</option>`).join('');html+=`<select onchange="changeClockOwner(this.value)" style="width:100%;padding:9px 12px;border:1px solid rgba(255,255,255,.2);border-radius:10px;background:rgba(255,255,255,.08);color:#fff;font-size:14px;outline:none;font-family:inherit;margin-bottom:12px;">${opts}</select>`;}
    }
    html+=`<div style="display:flex;gap:8px;margin-bottom:10px;"><input id="clockNewCardInput" placeholder="输入字卡内容（每行一条）" style="flex:1;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#fff;font-size:14px;outline:none;font-family:inherit;"><button class="btn-primary" style="padding:10px 16px;border-radius:10px;background:linear-gradient(135deg,#8B5CF6,#A78BFA);" onclick="clockAddCard()">添加</button></div>`;
    html+=`<div style="margin-bottom:12px;"><button class="btn-outline" style="width:100%;color:rgba(255,255,255,.8);border-color:rgba(255,255,255,.25);" onclick="clockBatchImport()">📥 批量导入</button></div>`;
    if(!list.length){html+=`<div style="text-align:center;padding:40px 20px;color:rgba(255,255,255,.5);"><div style="font-size:44px;margin-bottom:12px;opacity:.6;">📇</div><div>还没有字卡，先添加一些吧</div></div>`;}
    else{
        html+='<div style="display:flex;flex-direction:column;gap:8px;">';
        list.forEach(x=>{const scopeTag=x.scope==='shared'?'公共':'独立';html+=`<div style="display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:11px 12px;"><span style="flex:1;font-size:14px;word-break:break-word;">${escapeHtml(x.word)}</span><span style="font-size:10px;padding:1px 6px;border-radius:6px;background:${x.scope==='shared'?'rgba(139,92,246,.3)':'rgba(239,68,68,.25)'};color:#fff;">${scopeTag}</span><button style="background:none;border:none;color:#A78BFA;font-size:16px;cursor:pointer;padding:2px 6px;" onclick="clockEditCard('${x.id}')">✎</button><button style="background:none;border:none;color:#FCA5A5;font-size:16px;cursor:pointer;padding:2px 6px;" onclick="clockDeleteCard('${x.id}')">🗑</button></div>`;});
        html+='</div>';
    }
    body.innerHTML=html;
}
function clockAddCard(){
    const inp=document.getElementById('clockNewCardInput');
    if(!inp)return;
    const val=inp.value.trim();
    if(!val){showToast('请输入内容');return;}
    ensureClockCards();
    const dir=clockState.cardDir||'place';
    const list=dir==='place'?data.clockCards.place:data.clockCards.action;
    let ownerId=null;
    if(clockScope==='private'){ownerId=clockState.clockOwnerId;if(!ownerId){showToast('请先选择联系人');return;}}
    const words=val.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
    const existing=new Set(list.filter(x=>x.scope===clockScope&&x.ownerId===ownerId).map(x=>x.word));
    let added=0,skipped=0;
    words.forEach(w=>{if(existing.has(w)){skipped++;return;}list.push({id:genId(),word:w,scope:clockScope,ownerId});existing.add(w);added++;});
    saveData(true);renderClockCardsManage(document.getElementById('clockBody'));
    if(added)showToast(`已添加 ${added} 张${skipped?`，跳过 ${skipped} 张重复`:''}`);
    else showToast('内容已存在');
}
function clockBatchImport(){
    showModal('📥 批量导入查岗字卡',`<label>每行一条</label><textarea id="clockBatchInput" rows="8" placeholder="客厅&#10;卧室&#10;公司"></textarea><div class="setting-sub">将导入到当前作用域（${clockScope==='shared'?'公共':'当前联系人独立'}）</div><div class="modal-actions"><button class="btn-cancel" onclick="closeModal()">取消</button><button class="btn-confirm" onclick="confirmClockBatchImport()">导入</button></div>`);
}
function confirmClockBatchImport(){
    const ta=document.getElementById('clockBatchInput');
    if(!ta)return;
    const lines=ta.value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
    if(!lines.length){showToast('请输入内容');return;}
    ensureClockCards();
    const dir=clockState.cardDir||'place';
    const list=dir==='place'?data.clockCards.place:data.clockCards.action;
    let ownerId=null;
    if(clockScope==='private'){ownerId=clockState.clockOwnerId;if(!ownerId){showToast('请先选择联系人');return;}}
    const existing=new Set(list.filter(x=>x.scope===clockScope&&x.ownerId===ownerId).map(x=>x.word));
    let added=0,skipped=0;
    lines.forEach(w=>{if(existing.has(w)){skipped++;return;}list.push({id:genId(),word:w,scope:clockScope,ownerId});existing.add(w);added++;});
    saveData(true);closeModal();renderClockCardsManage(document.getElementById('clockBody'));
    showToast(`导入完成：新增 ${added} 张，跳过 ${skipped} 张`);
}
function clockDeleteCard(id){
    const dir=clockState.cardDir||'place';
    const list=dir==='place'?data.clockCards.place:data.clockCards.action;
    const idx=list.findIndex(x=>x.id===id);
    if(idx<0)return;
    if(!confirm('删除这张查岗字卡？'))return;
    list.splice(idx,1);saveData(true);
    renderClockCardsManage(document.getElementById('clockBody'));
    showToast('已删除');
}
function clockEditCard(id){
    const dir=clockState.cardDir||'place';
    const list=dir==='place'?data.clockCards.place:data.clockCards.action;
    const card=list.find(x=>x.id===id);
    if(!card)return;
    const nv=prompt('编辑查岗字卡：',card.word);
    if(nv===null)return;
    const w=nv.trim();
    if(!w){showToast('内容不能为空');return;}
    if(list.some(x=>x.word===w&&x.id!==id)){showToast('⚠️ 该字卡已存在');return;}
    card.word=w;saveData(true);
    renderClockCardsManage(document.getElementById('clockBody'));
    showToast('已更新');
}

    opts.forEach(([key,title,sub])=>{const checked=exportChoices[key]?' checked':'';html+=`<div class="export-option${checked}" id="eo_${key}" onclick="toggleExportChoice('${key}')" style="display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--border);border-radius:10px;cursor:pointer;background:var(--bg);"><div style="width:22px;height:22px;border:2px solid var(--border);border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:#fff;color:#fff;font-size:14px;font-weight:700;">✓</div><div style="flex:1;font-size:14px;">${title}<div style="font-size:12px;color:var(--text-light);">${sub}</div></div></div>`;});
    html+='</div><div class="modal-actions" style="flex-wrap:wrap;gap:8px;"><button class="btn-outline" onclick="toggleAllExport()">全选/反选</button><button class="btn-cancel" onclick="closeModal()">取消</button><button class="btn-confirm" onclick="doSelectiveExport()">导出</button></div>';
    showModal('选择性导出',html);
}
function toggleExportChoice(key){exportChoices[key]=!exportChoices[key];const el=document.getElementById('eo_'+key);if(el)el.classList.toggle('checked',exportChoices[key]);}

function importData(){
    const input=document.createElement('input');input.type='file';input.accept='application/json';
    input.onchange=function(e){
        const file=e.target.files[0];if(!file)return;
        const reader=new FileReader();
        reader.onload=function(ev){
            try{
                const imported=JSON.parse(ev.target.result);
                if(!imported||typeof imported!=='object'){showToast('⚠️ 无效的数据文件');return;}
                if(!confirm('导入将覆盖对应内容，确定继续吗？'))return;
                const def=defaultData();
                if(imported._type==='lingdong_selective'){
                    const keys=Object.keys(imported).filter(k=>!k.startsWith('_'));
                    keys.forEach(k=>{if(k==='theme'&&imported.theme)data.theme=Object.assign({},data.theme,imported.theme);else if(k==='settings'&&imported.settings)data.settings=Object.assign({},data.settings,imported.settings);else if(k==='replySettings'&&imported.replySettings)data.replySettings=Object.assign({},data.replySettings,imported.replySettings);else if(k==='patSettings'&&imported.patSettings)data.patSettings=Object.assign({},data.patSettings,imported.patSettings);else if(imported[k]!==undefined)data[k]=imported[k];});
                }else data=deepMerge(def,imported);
                initDataFields();saveData(true);applyTheme();renderHeader();renderMessagesNow();renderContacts();
                updateNavBadge();
                if(document.getElementById('pageSettings').classList.contains('active'))renderSettingsPage();
                if(musicPanelOpen)renderMusicPage();
                if(letterPanelOpen)renderLetterPage();
                updateLetterMenuDot();
                if(data.replySettings.randomStatus)startRandomStatus();
                scheduleAutoMessage();
                data.contacts.forEach(c=>{ if(isGroup(c) && c.groupAuto && c.groupAuto.enabled) scheduleGroupAuto(c.id); });
                showToast('✅ 数据导入成功');
            }catch(err){showToast('⚠️ 数据解析失败');}
        };
        reader.readAsText(file);
    };
    input.click();
}

function pokePartnerContinue(){
    const c=getActiveContact();if(!c)return;
    const cid = c.id;
    scheduler.cancelByKey('pokeContinue');
    scheduler.add(()=>{
        const cc = getContact(cid);
        if(!cc) return;
        const count = Math.random() < 0.5 ? 1 : 2;
        for(let i=0;i<count;i++){
            scheduler.add(()=>{
                const cc2 = getContact(cid);
                if(!cc2) return;
                const cards2 = getCardsForContact(cc2);
                let text;
                if(cards2.length) text = cards2[Math.floor(Math.random()*cards2.length)];
                else { const fb = ['嗯嗯','在的','怎么啦','继续说','我在听']; text = fb[Math.floor(Math.random()*fb.length)]; }

                let senderName = '';
                let senderId = '';
                if(isGroup(cc2)){
                    const now = Date.now();
                    const members = (cc2.members||[]).map(id=>getContact(id)).filter(m => m && !(cc2.mutedUntil && cc2.mutedUntil[m.id] && cc2.mutedUntil[m.id] > now));
                    if(members.length){
                        const m = members[Math.floor(Math.random()*members.length)];
                        senderName = m.name;
                        senderId = m.id;
                    }
                }

                addMessage('partner', text, 'text', null, false, false, senderName, cid, senderId);
                if(i===count-1) afterPartnerReply(cid);
            }, i*700, 'pokeContinueMsg_'+i);
        }
    }, 3000, 'pokeContinue');
}

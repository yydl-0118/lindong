<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FFD5DE">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="临冬">
<meta name="description" content="临冬 · Reaching the depths of the soul's heart">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon.png">
<title>临冬</title>
<style>
#splash{position:fixed;inset:0;z-index:99999;background:linear-gradient(160deg,#FFE4E9,#FFD5DE 55%,#FFE9EE);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .65s,visibility .65s;gap:0}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}
#splash .splash-icon{position:relative;width:min(46vw,170px);height:min(46vw,170px);border-radius:50%;overflow:hidden;background:linear-gradient(160deg,#FFF6F8,#FFD5DE);box-shadow:0 18px 50px rgba(255,140,165,.4);display:flex;align-items:center;justify-content:center;animation:splashFloat 3.2s ease-in-out infinite;margin-bottom:34px;border:4px solid #fff}
#splash .splash-icon img{position:relative;z-index:2;width:100%;height:100%;object-fit:cover;display:block}
#splash .splash-icon .splash-fallback{position:absolute;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;font-size:min(17vw,64px);line-height:1;color:#FF8FA8;text-shadow:0 4px 12px rgba(255,140,165,.35)}
#splash .splash-bottom{text-align:center;font-size:15px;color:#C07A8D;line-height:1.9;font-family:"Times New Roman",Georgia,serif;letter-spacing:.5px;padding:0 16px;animation:fadeUp 1.2s ease .3s both;max-width:92vw;word-break:break-word}
@keyframes splashFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-10px) scale(1.02)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
    --primary:#4A90D9;--primary-light:#6BA8E8;--primary-dark:#3A7BC8;
    --bg:#f5f7fa;--chat-bg:#f5f7fa;--card-bg:#fff;--text:#1a1a2e;--text-light:#6b7280;
    --border:#e5e7eb;--shadow:0 2px 12px rgba(0,0,0,.08);
    --radius:16px;--radius-sm:10px;
    --safe-bottom:env(safe-area-inset-bottom,0px);--safe-top:env(safe-area-inset-top,0px);
    --header-bg:#fff;--footer-bg:#fff;
    --bubble-me:#4A90D9;--bubble-me-text:#fff;--bubble-other:#e8ecf1;--bubble-other-text:#1a1a2e;
    --bubble-radius:16px;--msg-font-size:15px;--avatar-radius:50%;
}
html,body{height:100%;width:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:15px;user-select:none;-webkit-user-select:none;}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px}

#app{display:flex;flex-direction:column;height:100%;max-width:480px;margin:0 auto;background:var(--bg);position:relative;overflow:hidden;box-shadow:0 0 30px rgba(0,0,0,.05)}

.page{display:none;flex-direction:column;flex:1;min-height:0;overflow:hidden;background:var(--bg)}
.page.active{display:flex}
.page-header{background:var(--header-bg);padding:calc(10px + var(--safe-top)) 16px 10px;border-bottom:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;gap:10px;min-height:56px;position:relative}
.page-header .back-btn{background:none;border:none;font-size:26px;line-height:1;cursor:pointer;color:var(--text);padding:0 4px 0 0}
.page-header .title{font-size:18px;font-weight:700;flex:1;letter-spacing:.5px}
.page-header .action-btn{background:none;border:none;font-size:14px;color:var(--primary);font-weight:500;cursor:pointer;padding:4px 8px}
.page-body{flex:1;overflow-y:auto;padding:12px 16px;-webkit-overflow-scrolling:touch}

#contactsBody{padding:0}
#contactsHeader{background:var(--header-bg);border-bottom:1px solid var(--border);transition:background .25s ease;}
#contactsHeader .title{color:var(--text);}
#contactsHeader .plus-btn{color:var(--primary);}
#contactsHeader .plus-btn:active{background:var(--bg);transform:scale(.94)}
#pageContacts.home-bg{background-size:cover;background-position:center;background-repeat:no-repeat;}
#pageContacts.home-bg #contactsBody{background:transparent;}
#pageContacts.home-bg #contactsHeader{background:var(--primary);backdrop-filter:none;-webkit-backdrop-filter:none;border-bottom:1px solid rgba(255,255,255,.25);}
#pageContacts.home-bg #contactsHeader .title,
#pageContacts.home-bg #contactsHeader .plus-btn{color:#fff;}
#pageContacts.home-bg .contact-item{background:rgba(255,255,255,var(--home-card-alpha,0.72));backdrop-filter:none;-webkit-backdrop-filter:none;border-bottom:1px solid rgba(255,255,255,.35);}
#pageContacts.home-bg .contact-item:active{background:rgba(255,255,255,calc(var(--home-card-alpha,0.72) + 0.15));}
#pageContacts.home-bg .empty-state{background:rgba(255,255,255,.8);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:16px;margin:24px 16px;box-shadow:0 6px 20px rgba(0,0,0,.08);}
.plus-btn{background:none;border:none;font-size:26px;line-height:1;color:var(--text);cursor:pointer;padding:2px 10px 6px;border-radius:8px;transition:.15s}
.plus-btn:active{background:var(--border);transform:scale(.94)}
.plus-menu{position:absolute;top:calc(54px + var(--safe-top));right:10px;background:linear-gradient(180deg,var(--primary) 0%,var(--primary-dark,var(--primary)) 100%);color:#fff;border-radius:12px;padding:6px 0;min-width:156px;box-shadow:0 12px 36px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.18);opacity:0;visibility:hidden;transform:translateY(-10px) scale(.94);transform-origin:top right;transition:.18s ease;z-index:600;overflow:hidden;border:1px solid rgba(255,255,255,.18)}
.plus-menu.open{opacity:1;visibility:visible;transform:translateY(0) scale(1)}
.plus-menu-item{display:flex;align-items:center;gap:12px;padding:12px 18px;font-size:15px;cursor:pointer;white-space:nowrap;color:#fff}
.plus-menu-item:active{background:rgba(255,255,255,.18)}
.plus-menu-item .pm-icon{font-size:17px;width:20px;text-align:center;display:flex;align-items:center;justify-content:center}
#plusMenu .pm-icon svg path,
#plusMenu .pm-icon svg circle,
#plusMenu .pm-icon svg rect,
#plusMenu .pm-icon svg line,
#plusMenu .pm-icon svg polyline{stroke:#fff}
#plusMenu .pm-icon svg path[fill="#333"],
#plusMenu .pm-icon svg [fill="#333"]{fill:#fff}

.contact-item{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--card-bg);border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s;user-select:none;touch-action:pan-y}
.contact-item:active{background:#eef1f5}
.contact-avatar{width:48px;height:48px;border-radius:10px;flex-shrink:0;background:var(--primary);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:20px;position:relative}
.contact-avatar img{width:100%;height:100%;object-fit:cover;display:block;border-radius:10px}
.contact-unread{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:#FA5151;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-sizing:border-box;z-index:2;box-shadow:0 1px 4px rgba(0,0,0,.2);line-height:1}
.contact-main{flex:1;min-width:0}
.contact-name{font-size:16px;font-weight:500;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.contact-name .status-dot{width:7px;height:7px;border-radius:50%;background:#34d399;flex-shrink:0}
.contact-name .status-dot.offline{background:#9ca3af}
.contact-preview{font-size:13px;color:var(--text-light);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.contact-meta{flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:4px;padding-left:6px}
.contact-time{font-size:11px;color:var(--text-light)}

#header{background:var(--header-bg);padding:calc(8px + var(--safe-top)) 12px 8px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);flex-shrink:0;min-height:60px;z-index:10}
#header .left{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
#header .back-btn{background:none;border:none;font-size:26px;line-height:1;padding:0 2px;color:var(--text);cursor:pointer;flex-shrink:0}
#header .avatar-wrap{width:40px;height:40px;border-radius:50%;overflow:hidden;flex-shrink:0;background:var(--border);border:2px solid var(--primary-light);cursor:pointer}
#header .avatar-wrap img{width:100%;height:100%;object-fit:cover;display:block}
#header .avatar-wrap .avatar-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;color:#fff;background:var(--primary)}
#header .info{flex:1;min-width:0}
#header .info .name{font-weight:600;font-size:17px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
#header .info .status{font-size:12px;color:var(--text-light);display:flex;align-items:center;gap:4px}
#header .info .status .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#34d399}
#header .info .status .dot.offline{background:#9ca3af}
#header .right{display:flex;align-items:center;gap:2px;flex-shrink:0}
#header .right button{background:none;border:none;font-size:20px;padding:6px 8px;border-radius:8px;cursor:pointer;color:var(--text-light);transition:.2s;line-height:1}
#header .right button:active{background:var(--border);transform:scale(.94)}

#message-area{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 10px 8px;display:flex;flex-direction:column;gap:8px;background-color:var(--chat-bg);background-size:cover;background-position:center;background-repeat:no-repeat;-webkit-overflow-scrolling:touch;min-height:0;position:relative}

.msg-group{display:flex;gap:8px;max-width:84%;align-items:flex-start;animation:msgIn .22s ease}
.msg-group.me{align-self:flex-end;flex-direction:row-reverse}
.msg-group.other{align-self:flex-start}
.msg-side{display:flex;flex-direction:column;align-items:center;gap:3px;flex-shrink:0;min-width:38px;}
.msg-side-time{font-size:10px;color:var(--text-light);opacity:.8;white-space:nowrap;line-height:1;font-variant-numeric:tabular-nums;}
.msg-avatar{width:38px;height:38px;border-radius:var(--avatar-radius);overflow:hidden;flex-shrink:0;background:var(--primary);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;color:#fff;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.msg-avatar img{width:100%;height:100%;object-fit:cover}
.msg-body{display:flex;flex-direction:column;min-width:0;max-width:100%}
.msg-group.me .msg-body{align-items:flex-end}
.msg-bubble{padding:10px 14px;border-radius:var(--bubble-radius);word-break:break-word;line-height:1.5;font-size:var(--msg-font-size);position:relative;max-width:100%;box-shadow:0 1px 2px rgba(0,0,0,.04);background-clip:padding-box;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);}
.msg-group.me .msg-bubble{background:var(--bubble-me);color:var(--bubble-me-text);border-bottom-right-radius:4px}
.msg-group.other .msg-bubble{background:var(--bubble-other);color:var(--bubble-other-text);border-bottom-left-radius:4px}
.msg-bubble .time{display:none}

/* ===== 引用消息（可点击跳转） ===== */
.msg-bubble .reply-ref{font-size:12px;opacity:1;padding:4px 8px;background:rgba(0,0,0,.08);border-radius:6px;margin-bottom:6px;display:block;border-left:3px solid var(--primary-light);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px;cursor:pointer;transition:background .15s,opacity .15s;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);}
.msg-bubble .reply-ref:active{background:rgba(0,0,0,.16);opacity:1;}

/* ===== 跳转高亮 ===== */
@keyframes msgFlash{
    0%{box-shadow:0 0 0 3px var(--primary),0 0 18px rgba(74,144,217,.6);}
    100%{box-shadow:0 1px 2px rgba(0,0,0,.04);}
}
.msg-group.msg-highlight .msg-bubble{animation:msgFlash 1.6s ease;}
.msg-system-center.msg-highlight span{background:var(--primary)!important;color:#fff!important;}
/* ===== 消息操作条（气泡上方） ===== */
.msg-actions-bar{display:none;gap:2px;margin-bottom:4px;flex-wrap:wrap;background:rgba(0,0,0,.05);border-radius:10px;padding:2px 4px;max-width:100%;}
.msg-actions-bar.show{display:flex;}
.msg-group.other .msg-actions-bar{align-self:flex-start;}
.msg-group.me .msg-actions-bar{align-self:flex-end;}
.msg-actions-bar button{background:none;border:none;font-size:12px;color:var(--text-light);padding:4px 8px;border-radius:8px;cursor:pointer;font-family:inherit;white-space:nowrap;}
.msg-actions-bar button:active{background:rgba(0,0,0,.08);}
.msg-time-divider{text-align:center;font-size:11px;color:var(--text-light);padding:6px 0 2px;opacity:.7}
.msg-time-divider span{background:rgba(0,0,0,.06);padding:2px 10px;border-radius:10px}
.msg-system-center{text-align:center;padding:2px 0;width:100%;align-self:center;animation:msgIn .22s ease}
.msg-system-center span{display:inline-block;font-size:12px;color:var(--text-light);background:rgba(0,0,0,.05);padding:5px 14px;border-radius:12px;max-width:82%;word-break:break-word;line-height:1.5;transition:background .25s,color .25s;}
.msg-system-center span b{font-weight:600;color:var(--text)}
.msg-system-center .sys-icon{font-size:13px;margin-right:3px}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

.msg-bubble.recall-bubble {cursor: pointer;user-select: none;}

.auto-badge{position:absolute;top:-6px;left:-8px;font-size:14px;line-height:1;z-index:5;pointer-events:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
.msg-group.me .auto-badge{left:auto;right:-8px}

/* ===== 表情 / 图片气泡：贴纸不再透出背景 ===== */
.msg-bubble.emoji-bubble{background:#fff!important;color:transparent!important;box-shadow:0 2px 8px rgba(0,0,0,.08)!important;border:none!important;padding:4px!important;line-height:0;max-width:200px;position:relative;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;overflow:hidden;}
.msg-bubble.emoji-bubble .emoji-img{max-width:110px;max-height:120px;border-radius:calc(var(--bubble-radius) - 4px);display:block;background:#fff;}
.msg-bubble.emoji-bubble.has-reply .emoji-img{background:transparent;box-shadow:none;}
.msg-bubble.emoji-bubble .emoji-img.img-large{max-width:180px;max-height:200px}
.msg-bubble.emoji-bubble .time{display:none}
.msg-bubble.emoji-bubble.has-reply{background:var(--bubble-other)!important;color:var(--bubble-other-text)!important;padding:10px 14px!important;box-shadow:0 1px 2px rgba(0,0,0,.04)!important;line-height:1.5!important;max-width:100%}
.msg-group.me .msg-bubble.emoji-bubble.has-reply{background:var(--bubble-me)!important;color:var(--bubble-me-text)!important}
.msg-bubble.emoji-bubble.has-reply .time{display:none}

#footer{background:var(--footer-bg);padding:8px 12px calc(8px + var(--safe-bottom));display:flex;flex-direction:column;border-top:1px solid var(--border);flex-shrink:0;position:relative;z-index:10}
#footer .footer-main{display:flex;align-items:center;gap:6px;width:100%;min-width:0}
#footer .input-wrap{flex:1;min-width:0;display:flex;align-items:center;background:var(--bg);border-radius:22px;padding:4px 12px;border:1px solid var(--border);transition:.2s;min-height:40px}
#footer .input-wrap:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px rgba(74,144,217,.12)}
#footer .input-wrap textarea{flex:1;width:100%;min-width:0;border:none;background:transparent;resize:none;outline:none;font-size:15px;font-family:inherit;padding:6px 0;max-height:100px;line-height:1.4;color:var(--text);min-height:22px}
#footer .tool-btn{background:none;border:none;font-size:22px;padding:0;border-radius:50%;cursor:pointer;color:var(--text-light);transition:.2s;flex-shrink:0;width:40px;height:40px;display:flex;align-items:center;justify-content:center}
#footer .tool-btn:active{transform:scale(.88);background:var(--border)}
#footer .send-btn{background:var(--primary);color:#fff;border:none;border-radius:50%;width:38px;height:38px;font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;transition:.2s;box-shadow:0 2px 8px rgba(74,144,217,.3);padding:0}
#footer .send-btn:active{transform:scale(.92);opacity:.8}
#replyPreview{display:none;align-items:center;gap:6px;background:var(--bg);border-left:3px solid var(--primary);border-radius:8px;padding:6px 10px;margin-bottom:6px;font-size:12px;color:var(--text-light);width:100%}
#replyPreview .rp-icon{flex-shrink:0;font-size:13px;color:var(--primary)}
#replyPreview .rp-text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#replyPreview .rp-close{background:none;border:none;font-size:14px;color:var(--text-light);cursor:pointer;padding:0 4px;flex-shrink:0;line-height:1}

#morePanel{position:absolute;bottom:calc(100% + 10px);left:12px;z-index:6000;background:#fff;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.18);padding:6px;min-width:152px;transform:scale(.85);transform-origin:bottom left;opacity:0;visibility:hidden;transition:transform .2s,opacity .2s,visibility .2s}
#morePanel.open{transform:scale(1);opacity:1;visibility:visible}
#morePanel .more-item{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:10px;cursor:pointer;font-size:15px;font-weight:500;color:var(--text);transition:.15s;white-space:nowrap}
#morePanel .more-item:active{background:var(--bg)}
#morePanel .more-item .mi-icon{font-size:20px}

#bottom-nav{display:flex;background:var(--footer-bg);border-top:1px solid var(--border);flex-shrink:0;padding:4px 0 calc(4px + var(--safe-bottom));justify-content:space-around;align-items:center;position:relative;z-index:10}
#bottom-nav .nav-item{display:flex;flex-direction:column;align-items:center;gap:1px;background:none;border:none;font-size:10px;color:#9ca3af;padding:4px 14px;cursor:pointer;transition:.2s;position:relative;min-width:56px}
#bottom-nav .nav-item .nav-icon{font-size:22px;line-height:1.2;position:relative;display:inline-block}
#bottom-nav .nav-item .nav-badge{position:absolute;top:-6px;right:-15px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:#FA5151;color:#fff;font-size:10px;font-weight:700;display:none;align-items:center;justify-content:center;line-height:1;border:1.5px solid #fff;box-sizing:border-box;box-shadow:0 1px 3px rgba(0,0,0,.25);letter-spacing:0}
#bottom-nav .nav-item .nav-badge.show{display:flex}
#bottom-nav .nav-item .nav-label{font-size:10px;font-weight:500;letter-spacing:.3px}
#bottom-nav .nav-item.active{color:var(--primary)}
#bottom-nav .nav-item:active{transform:scale(.92)}

#emojiPanel{position:fixed;bottom:0;left:0;right:0;background:var(--card-bg);border-top:1px solid var(--border);max-height:50vh;z-index:9998;transform:translateY(100%);transition:transform .3s ease;display:flex;flex-direction:column;padding:8px 12px calc(8px + var(--safe-bottom));box-shadow:0 -4px 20px rgba(0,0,0,.15);max-width:480px;margin:0 auto;border-radius:16px 16px 0 0}
#emojiPanel.open{transform:translateY(0)}
#emojiPanel .panel-header{display:flex;justify-content:space-between;align-items:center;padding-bottom:8px;border-bottom:1px solid var(--border);flex-shrink:0}
#emojiPanel .panel-header .title{font-weight:600;font-size:16px}
#emojiPanel .panel-header .close-btn{background:none;border:none;font-size:20px;cursor:pointer;color:var(--text-light);padding:4px 8px}
#emojiPanel .emoji-scroll{flex:1;overflow-y:auto;padding:8px 0}
#emojiPanel .emoji-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
#emojiPanel .emoji-grid .emoji-item{aspect-ratio:1/1;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s}
#emojiPanel .emoji-grid .emoji-item:active{transform:scale(.94);background:var(--bg)}
#emojiPanel .emoji-grid .emoji-item img{width:100%;height:100%;object-fit:cover;pointer-events:none;display:block}
#emojiPanel .panel-actions{display:flex;gap:8px;padding-top:8px;border-top:1px solid var(--border);flex-shrink:0}
#emojiPanel .panel-actions .pat-btn,#emojiPanel .panel-actions .manage-btn{flex:1;padding:10px;border-radius:20px;font-size:15px;font-weight:500;cursor:pointer;text-align:center;transition:.2s}
#emojiPanel .panel-actions .pat-btn{background:var(--primary);color:#fff;border:none}
#emojiPanel .panel-actions .manage-btn{background:var(--bg);color:var(--text);border:1px solid var(--border)}

#plusPanel,#letterPanel,#divinationPanel,#clockPanel,#musicPanel{position:fixed;inset:0;z-index:5400;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.9,.3,1.05);max-width:480px;margin:0 auto;overflow:hidden}
#plusPanel.open,#letterPanel.open,#divinationPanel.open,#clockPanel.open,#musicPanel.open{transform:translateY(0)}

#plusPanel{background:var(--bg);z-index:5000;box-shadow:0 -8px 40px rgba(0,0,0,.15)}
.plus-header{display:flex;align-items:center;justify-content:space-between;padding:calc(12px + var(--safe-top)) 16px 12px;background:var(--header-bg);border-bottom:1px solid var(--border);flex-shrink:0}
.plus-header .plus-title{font-size:17px;font-weight:600}
.plus-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--text-light);padding:4px 8px;border-radius:8px}
.plus-body{flex:1;overflow-y:auto;padding:0 0 40px}
.plus-body-inner{padding:12px 16px 0}

#letterPanel{background:linear-gradient(180deg,#FFF9F0,#FFF3E0);z-index:5400;color:#5B4636}
.letter-header{display:flex;align-items:center;justify-content:space-between;padding:calc(12px + var(--safe-top)) 16px 12px;border-bottom:1px solid rgba(91,70,54,.12);flex-shrink:0;background:rgba(255,255,255,.6)}
.letter-header .title{font-size:17px;font-weight:600;letter-spacing:1px;color:#8B5E3C}
.letter-close{background:none;border:none;font-size:22px;color:#8B5E3C;cursor:pointer;padding:4px 8px;border-radius:8px}
.letter-body{flex:1;overflow-y:auto;padding:14px 16px 40px}

#divinationPanel{background:linear-gradient(180deg,#1a1530,#2a1e4a 50%,#1a1530);z-index:5500;color:#fff}
.div-header{display:flex;align-items:center;justify-content:space-between;padding:calc(12px + var(--safe-top)) 16px 12px;border-bottom:1px solid rgba(255,255,255,.1);flex-shrink:0;background:rgba(0,0,0,.2)}
.div-header .title{font-size:17px;font-weight:600;letter-spacing:1px}
.div-close{background:none;border:none;font-size:22px;color:#fff;cursor:pointer;padding:4px 8px;border-radius:8px;opacity:.85}
.div-body{flex:1;overflow-y:auto;padding:16px 16px 40px}

#clockPanel{background:linear-gradient(180deg,#141428,#1c1c3a 50%,#141428);z-index:5450;color:#fff}
.clock-header{display:flex;align-items:center;justify-content:space-between;padding:calc(12px + var(--safe-top)) 16px 12px;border-bottom:1px solid rgba(255,255,255,.1);flex-shrink:0;background:rgba(0,0,0,.2)}
.clock-header .title{font-size:17px;font-weight:600;letter-spacing:1px}
.clock-close{background:none;border:none;font-size:22px;color:#fff;cursor:pointer;padding:4px 8px;border-radius:8px;opacity:.85}
.clock-body{flex:1;overflow-y:auto;padding:20px 16px 40px}

#musicPanel{background:var(--bg);z-index:5200}
.music-header{display:flex;align-items:center;justify-content:space-between;padding:calc(12px + var(--safe-top)) 16px 12px;background:var(--header-bg);border-bottom:1px solid var(--border);flex-shrink:0}
.music-header .title{font-size:17px;font-weight:600}
.music-body{flex:1;overflow-y:auto;padding:14px 16px 90px}

.tool-tabs{display:flex;border-bottom:2px solid var(--border);margin-bottom:12px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tool-tabs .tab{flex:1;text-align:center;padding:10px 2px;font-size:13px;font-weight:500;color:var(--text-light);cursor:pointer;border-bottom:2px solid transparent;transition:.2s;white-space:nowrap;min-width:70px}
.tool-tabs .tab.active{color:var(--primary);border-bottom-color:var(--primary)}

.setting-section{margin-top:14px}
.setting-section .section-header{display:flex;justify-content:space-between;align-items:center;padding:10px 4px 8px;cursor:pointer}
.setting-section .section-header .section-title{font-size:13px;font-weight:600;color:var(--text-light);letter-spacing:.5px;display:flex;align-items:center;gap:6px}
.setting-section .section-header .section-arrow{font-size:12px;color:var(--text-light);transition:transform .25s;display:inline-block}
.setting-section.collapsed .section-header .section-arrow{transform:rotate(-90deg)}
.setting-section.collapsed .section-content{display:none}
.setting-item{background:var(--card-bg);border-radius:var(--radius-sm);padding:14px 16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;border:1px solid var(--border);flex-wrap:wrap;gap:8px}
.setting-item .label{font-size:14px;font-weight:500}
.setting-item .value{font-size:14px;color:var(--text-light);display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.setting-item .value input[type=number],.setting-item .value input[type=text]{border:1px solid var(--border);border-radius:6px;padding:5px 8px;font-size:14px;background:var(--bg);width:70px;outline:none;color:var(--text)}
.setting-item .value input[type=color]{width:40px;height:40px;padding:2px;border-radius:50%;border:1px solid var(--border);background:var(--bg);cursor:pointer}
.setting-item .value input[type=range]{width:120px;accent-color:var(--primary)}
.setting-item .value .edit-trigger{font-size:14px;color:var(--primary);cursor:pointer}
.setting-item .value .toggle-switch{position:relative;width:44px;height:24px;background:var(--border);border-radius:12px;cursor:pointer;transition:.2s;flex-shrink:0;z-index:1}
.setting-item .value .toggle-switch.active{background:var(--primary)}
.setting-item .value .toggle-switch::after{content:'';position:absolute;width:20px;height:20px;background:#fff;border-radius:50%;top:2px;left:2px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.setting-item .value .toggle-switch.active::after{left:22px}
.setting-item .value .bg-preview{width:56px;height:56px;border-radius:8px;background-size:cover;background-position:center;border:1px solid var(--border);background-color:var(--bg)}
.setting-sub{font-size:12px;color:var(--text-light);margin-top:6px;line-height:1.6;padding:0 4px}
.skin-presets{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;padding:0 4px}
.skin-preset{width:44px;height:44px;border-radius:50%;cursor:pointer;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.15);transition:.2s}
.sub-group-title{font-size:12px;font-weight:600;color:var(--primary);margin:14px 4px 6px;letter-spacing:.5px;display:flex;align-items:center;gap:6px;opacity:.85}
.sub-group-title::before{content:'';display:inline-block;width:3px;height:12px;background:var(--primary);border-radius:2px}
.custom-css-wrap{display:flex;flex-direction:column;gap:8px}
.custom-css-wrap textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:12px;font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--bg);color:var(--text);outline:none;resize:vertical;min-height:140px;line-height:1.5}
.custom-css-actions{display:flex;gap:8px}

.status-tag{display:inline-flex;align-items:center;background:var(--border);padding:3px 10px;border-radius:12px;font-size:13px;margin:3px 4px 3px 0}
.status-tag .del-status{margin-left:6px;cursor:pointer;color:#ef4444;font-weight:600}

.me-header{display:flex;align-items:center;gap:16px;padding:calc(30px + var(--safe-top)) 20px 24px;background:var(--header-bg);border-bottom:1px solid var(--border);}
.me-avatar{width:78px;height:78px;border-radius:20px;overflow:hidden;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:600;position:relative;flex-shrink:0;box-shadow:0 6px 18px rgba(0,0,0,.12);cursor:pointer}
.me-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.me-avatar-edit{position:absolute;bottom:0;right:0;background:rgba(0,0,0,.5);color:#fff;font-size:11px;padding:3px 7px;border-radius:10px 0 0 0;line-height:1}
.me-info{flex:1;min-width:0}
.me-name{font-size:23px;font-weight:700;display:flex;align-items:center;gap:8px;word-break:break-all;line-height:1.3}
.me-edit{font-size:14px;color:var(--text-light);cursor:pointer;font-weight:400;flex-shrink:0}
.me-sub{font-size:12px;color:var(--text-light);margin-top:8px}
.me-menu{padding:14px 16px 0}
.me-menu-item{display:flex;align-items:center;gap:14px;background:var(--card-bg);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:.15s}
.me-menu-item:active{background:var(--bg);transform:scale(.99)}
.me-menu-icon{width:42px;height:42px;border-radius:13px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0}
.me-menu-text{flex:1;min-width:0}
.me-menu-title{font-size:15px;font-weight:600}
.me-menu-desc{font-size:12px;color:var(--text-light);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me-menu-arrow{font-size:24px;color:var(--text-light);flex-shrink:0;line-height:1}

.btn-primary{background:var(--primary);color:#fff;border:none;padding:8px 18px;border-radius:20px;font-size:14px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-family:inherit}
.btn-primary:active{transform:scale(.96);opacity:.85}
.btn-outline{background:transparent;color:var(--primary);border:1.5px solid var(--primary);padding:6px 16px;border-radius:20px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit}
.btn-outline:active{transform:scale(.96);background:rgba(74,144,217,.06)}
.btn-danger{background:#ef4444;color:#fff;border:none;padding:8px 16px;border-radius:20px;font-size:13px;cursor:pointer;font-family:inherit}
.btn-danger:active{transform:scale(.96)}

.modal-overlay{position:fixed;inset:0;background:rgba(6,6,10,0.98);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);animation:fadeIn .2s ease;isolation:isolate;}
.modal-box{background:#fff !important;border-radius:var(--radius);padding:24px 20px 20px;max-width:360px;width:100%;max-height:82vh;overflow-y:auto;color:#1a1a2e !important;animation:slideUp .25s ease;position:relative;z-index:10000;isolation:isolate;box-shadow:0 24px 80px rgba(0,0,0,.6);}
.modal-box .modal-title{font-size:18px;font-weight:600;margin-bottom:16px;text-align:center}
.modal-box label{font-size:13px;font-weight:500;color:#6b7280;display:block;margin-top:12px;margin-bottom:4px}
.modal-box input,.modal-box textarea,.modal-box select{width:100%;padding:10px 12px;border:1px solid #e5e7eb;border-radius:10px;font-size:15px;font-family:inherit;background:#f5f7fa;outline:none;color:#1a1a2e}
.modal-box .modal-actions{display:flex;gap:10px;margin-top:18px;justify-content:flex-end;flex-wrap:wrap}
.modal-box .modal-actions button{padding:8px 20px;border-radius:20px;border:none;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit}
.modal-box .modal-actions .btn-cancel{background:#e5e7eb;color:#1a1a2e}
.modal-box .modal-actions .btn-confirm{background:var(--primary);color:#fff}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}

.add-friend-avatar{width:84px;height:84px;border-radius:14px;margin:4px auto 8px;background:var(--bg);border:2px dashed var(--border);display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--text-light);cursor:pointer;overflow:hidden;transition:.15s}
.add-friend-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.group-member-list{max-height:200px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg)}
.group-member-item{display:flex;align-items:center;gap:10px;padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .15s}
.group-member-item:last-child{border-bottom:none}
.group-member-item .gmi-avatar{width:34px;height:34px;border-radius:8px;overflow:hidden;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0}
.group-member-item .gmi-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.group-member-item .gmi-name{flex:1;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.group-member-item .gmi-check{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;flex-shrink:0;transition:.15s}
.group-member-item.selected .gmi-check{background:var(--primary);border-color:var(--primary)}

.call-modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:10000;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px)}
.call-box{background:#1a1a2e;color:#fff;border-radius:30px;padding:32px 24px 28px;width:290px;text-align:center;position:relative}
.call-box .call-avatar{width:80px;height:80px;border-radius:50%;margin:0 auto 12px;overflow:hidden;border:3px solid var(--primary-light);background:var(--border)}
.call-box .call-avatar img{width:100%;height:100%;object-fit:cover}
.call-box .call-avatar .placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:600;color:#fff;background:var(--primary)}
.call-box .call-name{font-size:22px;font-weight:600;margin-bottom:4px}
.call-box .call-status{font-size:14px;color:#9ca3af;margin-bottom:8px;min-height:20px}
.call-box .call-countdown{font-size:13px;color:#FBBF24;margin-bottom:12px;min-height:18px}
.call-box .call-timer{font-size:28px;font-weight:300;margin-bottom:24px;font-variant-numeric:tabular-nums}
.call-box .call-actions{display:flex;justify-content:center;gap:20px}
.call-box .call-actions button{width:60px;height:60px;border-radius:50%;border:none;font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.call-box .call-actions .btn-end{background:#ef4444;color:#fff}
.call-box .call-actions .btn-answer{background:#34d399;color:#fff;animation:pulseBtn 1.2s infinite}
@keyframes pulseBtn{0%,100%{box-shadow:0 0 0 0 rgba(52,211,153,.7)}50%{box-shadow:0 0 0 12px rgba(52,211,153,0)}}
.call-box .call-minimize{position:absolute;top:12px;right:16px;background:rgba(255,255,255,.15);border:none;color:#fff;font-size:18px;padding:4px 8px;border-radius:8px;cursor:pointer}
#callMini{position:fixed;right:16px;bottom:130px;width:58px;height:58px;border-radius:50%;background:var(--primary);color:#fff;display:none;align-items:center;justify-content:center;font-size:24px;z-index:10001;box-shadow:0 6px 20px rgba(0,0,0,.35);cursor:grab;border:2px solid #fff;touch-action:none}
#callMini .mini-timer{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--text-light);background:rgba(255,255,255,.95);padding:1px 6px;border-radius:8px;white-space:nowrap;font-weight:600;pointer-events:none}

.toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.78);color:#fff;padding:8px 20px;border-radius:20px;font-size:14px;z-index:99999;pointer-events:none;animation:fadeIn .3s ease;backdrop-filter:blur(4px);max-width:80%}
.toast.hide{opacity:0;transition:.3s}
.typing-indicator{display:flex;gap:4px;padding:10px 14px;background:var(--bubble-other);border-radius:var(--bubble-radius);border-bottom-left-radius:4px;align-self:flex-start}
.typing-indicator span{width:7px;height:7px;background:var(--text-light);border-radius:50%;animation:typing 1.2s infinite ease-in-out}
.typing-indicator span:nth-child(2){animation-delay:.2s}
.typing-indicator span:nth-child(3){animation-delay:.4s}
@keyframes typing{0%,60%,100%{transform:translateY(0);opacity:.3}30%{transform:translateY(-6px);opacity:1}}
.empty-state{text-align:center;padding:40px 20px;color:var(--text-light);font-size:14px}
.empty-state .empty-icon{font-size:48px;margin-bottom:12px;opacity:.4}

.wc-toolbar{display:flex;gap:8px;margin-bottom:12px;align-items:center;flex-wrap:wrap}
.wc-scope-switch{display:flex;gap:4px;background:var(--card-bg);border:1px solid var(--border);border-radius:10px;padding:3px;flex-shrink:0}
.wc-scope-btn{padding:5px 12px;border-radius:8px;font-size:13px;font-weight:500;color:var(--text-light);cursor:pointer;border:none;background:transparent;transition:.2s;font-family:inherit;white-space:nowrap}
.wc-scope-btn.active{background:var(--primary);color:#fff}
.wc-search-wrap{flex:1;position:relative;display:flex;align-items:center;background:var(--card-bg);border:1px solid var(--border);border-radius:10px;padding:0 8px 0 32px;height:38px;min-width:120px}
.wc-search-wrap .search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:15px;color:var(--text-light);pointer-events:none}
.wc-search-wrap input{flex:1;border:none;background:transparent;outline:none;font-size:14px;color:var(--text);padding:0;min-width:0;font-family:inherit}
.wc-search-wrap .clear-search{background:none;border:none;font-size:14px;color:var(--text-light);cursor:pointer;padding:4px;display:none}
.wc-search-wrap.has-text .clear-search{display:block}
.wc-add-group-btn{flex-shrink:0;background:var(--primary);color:#fff;border:none;padding:0 14px;height:38px;border-radius:10px;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;font-family:inherit}
.wc-dedupe-btn{flex-shrink:0;background:var(--card-bg);border:1px solid var(--border);color:var(--text);border-radius:10px;height:38px;padding:0 12px;font-size:13px;cursor:pointer;font-family:inherit;white-space:nowrap}
.wc-contact-select{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:10px;background:var(--card-bg);color:var(--text);font-size:14px;outline:none;font-family:inherit;margin-bottom:12px}

.wc-batch-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.wc-batch-bar .btn-outline,.wc-batch-bar .btn-danger{font-size:12px;padding:5px 12px;border-radius:16px}
.wc-check{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;flex-shrink:0;background:#fff;transition:.15s;cursor:pointer;font-weight:700;line-height:1}
.wc-check.checked{background:var(--primary);border-color:var(--primary)}

.word-group-item{background:var(--card-bg);border-radius:var(--radius-sm);padding:14px 16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;border:1px solid var(--border);gap:8px}
.word-group-item .group-info{flex:1;min-width:0}
.word-group-item .group-info .group-name{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px}
.word-group-item .group-info .group-count{font-size:12px;color:var(--text-light)}
.word-group-item .group-actions{display:flex;gap:6px;align-items:center;flex-shrink:0}
.word-group-item .group-actions .add-card-btn{font-size:12px;color:#fff;background:var(--primary);padding:3px 12px;border-radius:12px;border:none;cursor:pointer;white-space:nowrap;font-family:inherit}
.word-group-item .group-actions button{background:none;border:none;font-size:16px;color:var(--text-light);cursor:pointer;padding:4px}
.scope-badge{display:inline-block;font-size:10px;padding:1px 6px;border-radius:6px;font-weight:500}
.scope-badge.shared{background:rgba(74,144,217,.15);color:var(--primary)}
.scope-badge.private{background:rgba(239,68,68,.12);color:#ef4444}
.disabled-badge{display:inline-block;font-size:10px;padding:1px 6px;border-radius:6px;font-weight:500;background:rgba(239,68,68,.12);color:#ef4444}
.word-card-item{background:var(--card-bg);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;border:1px solid var(--border);gap:8px}
.word-card-item .card-word{font-size:14px;flex:1;word-break:break-word}
.word-card-item .card-actions{display:flex;flex-shrink:0}
.word-card-item .card-actions button{background:none;border:none;font-size:16px;color:var(--text-light);cursor:pointer;padding:2px 6px}

.search-result-info{font-size:12px;color:var(--text-light);padding:6px 4px 10px;display:flex;justify-content:space-between}
.search-result-item{background:var(--card-bg);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;border:1px solid var(--border);gap:8px}
.search-result-item .sri-text{flex:1;min-width:0}
.search-result-item .sri-word{font-size:14px;word-break:break-word;margin-bottom:3px}
.search-result-item .sri-word mark{background:rgba(255,193,7,.45);color:var(--text);padding:0 1px;border-radius:2px}
.search-result-item .sri-group{font-size:11px;color:var(--text-light)}
.search-result-item .sri-group .group-chip{display:inline-block;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:1px 6px;color:var(--primary)}
.search-result-item .sri-actions{display:flex;gap:4px;flex-shrink:0}
.search-result-item .sri-actions button{background:none;border:none;font-size:15px;color:var(--text-light);cursor:pointer;padding:4px 6px;border-radius:6px}
.search-empty{text-align:center;padding:40px 20px;color:var(--text-light);font-size:14px}

function deepMerge(t,s){
    if(!s||typeof s!=='object') return t;
    if(!t||typeof t!=='object') return s;
    const o=Array.isArray(t)?t.slice():Object.assign({},t);
    for(const k in s){
        const v=s[k];
        if(v===undefined||v===null) continue;
        if(Array.isArray(v)) o[k]=v.slice();
        else if(typeof v==='object') o[k]=deepMerge(t[k]||{},v);
        else o[k]=v;
    }
    return o;
}

async function requestWakeLock(){
    try{
        if(!('wakeLock' in navigator)) return;
        if(document.visibilityState !== 'visible') return;
        if(wakeLock) return;
        wakeLock = await navigator.wakeLock.request('screen');
        if(wakeLock.addEventListener){
            wakeLock.addEventListener('release', ()=>{
                wakeLock = null;
                if(data.settings.keepAlive && document.visibilityState === 'visible'){
                    setTimeout(()=>{ requestWakeLock(); }, 1000);
                }
            });
        }
    }catch(e){}
}
function releaseWakeLock(){
    if(wakeLock){ try{ wakeLock.release(); }catch(e){} wakeLock = null; }
}
document.addEventListener('visibilitychange', async () => {
    if(document.visibilityState === 'visible'){
        if(data.settings.keepAlive){
            await requestWakeLock();
            try{ scheduler.tick(); }catch(e){}
            if(!_tickWorker){ try{ startTickWorker(); }catch(e){} }
        }
        if(callState && callState.active){
            if(callState.minimized){
                const mt=document.getElementById('miniTimer');
                if(mt) mt.textContent=fmtDuration(getCallElapsedSeconds());
            }else{
                updateCallTimerDisplay();
            }
        }
    } else {
        try{ flushSave(); }catch(e){}
    }
});

function genId(){return Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8);}
let _saveFailWarned = false;
let _saveTimer = null, _idbPromise = null;

function openIDB(){
    if(_idbPromise) return _idbPromise;
    _idbPromise = new Promise(resolve=>{
        let settled = false;
        const done = v => { if(!settled){ settled = true; resolve(v); } };
        try{
            if(!window.indexedDB){ done(null); return; }
            const req = indexedDB.open('lingdong_db', 2);
            req.onupgradeneeded = ()=>{ try{ if(!req.result.objectStoreNames.contains('kv')) req.result.createObjectStore('kv'); }catch(e){} };
            req.onsuccess = ()=>done(req.result);
            req.onerror = ()=>done(null);
            req.onblocked = ()=>done(null);
            setTimeout(()=>done(null), 2000);
        }catch(e){ done(null); }
    });
    return _idbPromise;
}
function idbSet(key,val){
    openIDB().then(db=>{
        if(!db) return;
        try{ db.transaction('kv','readwrite').objectStore('kv').put(val,key); }catch(e){}
    }).catch(()=>{});
}
function idbGet(key){
    return openIDB().then(db=>new Promise(resolve=>{
        if(!db){ resolve(null); return; }
        let settled = false;
        const done = v => { if(!settled){ settled = true; resolve(v); } };
        try{
            const r = db.transaction('kv','readonly').objectStore('kv').get(key);
            r.onsuccess = ()=>done(r.result || null);
            r.onerror = ()=>done(null);
            setTimeout(()=>done(null), 1500);
        }catch(e){ done(null); }
    })).catch(()=>null);
}

function saveNow(){
    data._updatedAt = Date.now();
    let json;
    try{ json = JSON.stringify(data); }catch(e){ return; }
    try{ idbSet('data', json); }catch(e){}
    try{
        localStorage.setItem(STORAGE_KEY, json);
        try{ localStorage.setItem(BACKUP_KEY, json); }catch(e){}
        _saveFailWarned = false;
        return;
    }catch(e){}
    try{
        const slim = buildSlimData(data);
        const slimJson = JSON.stringify(slim);
        localStorage.setItem(STORAGE_KEY, slimJson);
        if(!_saveFailWarned){ _saveFailWarned = true; showToast('⚠️ 存储空间紧张，已精简保存（完整数据已同步到本地镜像）'); }
        return;
    }catch(e2){}
    try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
    if(!_saveFailWarned){ _saveFailWarned = true; showToast('⚠️ 本地存储写入失败，完整数据已保存到镜像备份'); }
}

function flushSave(){
    if(_saveTimer){ clearTimeout(_saveTimer); _saveTimer = null; }
    saveNow();
}

function saveData(immediate){
    if(immediate){
        if(_saveTimer){ clearTimeout(_saveTimer); _saveTimer = null; }
        saveNow();
        return;
    }
    if(_saveTimer) clearTimeout(_saveTimer);
    _saveTimer = setTimeout(()=>{ _saveTimer = null; saveNow(); }, 16);
}

function buildSlimData(src){
    const slim = {
        _slimmed: true,
        _updatedAt: src._updatedAt,
        activeContactId: src.activeContactId,
        wordCards: src.wordCards,
        clockCards: src.clockCards,
        textEmojis: src.textEmojis,
        letters: src.letters,
        replySettings: src.replySettings,
        settings: src.settings,
        theme: src.theme,
        customStatuses: src.customStatuses,
        patSettings: src.patSettings,
        user: { name: (src.user && src.user.name) || '我', avatar: '' },
        contacts: [],
        emojis: [],
        music: src.music ? Object.assign({}, src.music, { list: [] }) : defaultData().music
    };
    if(src.user && src.user.avatar){
        try{ idbSet('user_avatar', src.user.avatar); }catch(e){}
    }
    if(Array.isArray(src.contacts)){
        const contactAssets = [];
        src.contacts.forEach(c=>{
            if(!c) return;
            const nc = Object.assign({}, c);
            if(nc.avatar){ contactAssets.push({type:'contact_avatar', id:c.id, data:nc.avatar}); nc.avatar=''; }
            if(nc.bgImage){ contactAssets.push({type:'contact_bg', id:c.id, data:nc.bgImage}); nc.bgImage=''; }
            if(Array.isArray(nc.messages)){
                nc.messages = nc.messages.map(m=>{
                    if(!m) return m;
                    if((m.type==='image'||m.type==='emoji') && m.content && String(m.content).length>500){
                        contactAssets.push({type:'msg_content', id:m.id, data:m.content});
                        m = Object.assign({}, m, {content:''});
                    }
                    if(m.type==='recall' && m.recalledContent && String(m.recalledContent).length>500){
                        contactAssets.push({type:'msg_recalled', id:m.id, data:m.recalledContent});
                        m = Object.assign({}, m, {recalledContent:''});
                    }
                    return m;
                });
            }
            slim.contacts.push(nc);
        });
        if(contactAssets.length){ try{ idbSet('contact_assets', contactAssets); }catch(e){} }
    }
    if(Array.isArray(src.emojis)){
        try{ idbSet('emojis', src.emojis.map(e=>({id:e.id, dataUrl:e.dataUrl||''}))); }catch(e){}
        slim.emojis = src.emojis.map(e=>({id:e.id, dataUrl:''}));
    }
    if(src.music && Array.isArray(src.music.list)){
        const musicUrls = [];
        slim.music.list = src.music.list.map(s=>{
            const ns = Object.assign({}, s);
            if(ns.url){ musicUrls.push({id:ns.id, url:ns.url}); ns.url=''; }
            return ns;
        });
        if(musicUrls.length){ try{ idbSet('music_urls', musicUrls); }catch(e){} }
    }
    return slim;
}

function loadData(){
    const def = defaultData();
    let raw = null;
    try{ raw = localStorage.getItem(STORAGE_KEY); }catch(e){}
    if(!raw){ try{ raw = localStorage.getItem(BACKUP_KEY); }catch(e){} }
    if(!raw){ data = def; return; }
    let parsed = null;
    try{ parsed = JSON.parse(raw); }
    catch(e){
        try{ const b = localStorage.getItem(BACKUP_KEY); if(b) parsed = JSON.parse(b); }catch(e2){}
    }
    if(!parsed || typeof parsed !== 'object'){ data = def; return; }
    try{
        if(Array.isArray(parsed.messages) && parsed.messages.length && (!parsed.contacts || !parsed.contacts.length)){
            const p = parsed.partner || {name:'小悸',avatar:'',status:'在线'};
            parsed.contacts = [{
                id: genId(), name: p.name || '小悸', avatar: p.avatar || '',
                status: p.status || '在线', messages: parsed.messages,
                createdAt: Date.now(), type: 'single', members: [], bgImage: '', unread: 0
            }];
            delete parsed.messages; delete parsed.partner;
        }
        if(Array.isArray(parsed.contacts)){ parsed.contacts = parsed.contacts.filter(c=>c && typeof c === 'object'); }
        if(parsed.wordCards && Array.isArray(parsed.wordCards.groups)){
            parsed.wordCards.groups = parsed.wordCards.groups.filter(g=>g && typeof g === 'object');
            parsed.wordCards.groups.forEach(g=>{
                if(!g.scope) g.scope = 'shared';
                if(g.scope === 'private' && !g.ownerId) g.ownerId = null;
                if(typeof g.disabled !== 'boolean') g.disabled = false;
                if(!Array.isArray(g.cards)) g.cards = [];
                g.cards = g.cards.filter(c=>c && typeof c === 'object');
                g.cards.forEach(c=>{ if(typeof c.disabled !== 'boolean') c.disabled = false; });
            });
        }
        if(parsed.clockCards){
            ['place','action'].forEach(k=>{
                if(Array.isArray(parsed.clockCards[k])){
                    parsed.clockCards[k] = parsed.clockCards[k].filter(c=>c && typeof c==='object');
                    parsed.clockCards[k].forEach(c=>{ if(!c.scope) c.scope = 'shared'; });
                }
            });
        }
        data = deepMerge(def, parsed);
        initDataFields();
    }catch(e){
        try{ data = deepMerge(def, (parsed && typeof parsed==='object') ? parsed : {}); initDataFields(); }
        catch(e2){ data = def; }
    }
}

function initDataFields(){
    if(!Array.isArray(data.contacts)) data.contacts = [];
    data.contacts = data.contacts.filter(c=>c && typeof c==='object');
    data.contacts.forEach(c=>{
        if(!Array.isArray(c.messages)) c.messages = [];
        c.messages = c.messages.filter(m=>m && typeof m==='object');
        if(!c.status) c.status = '在线';
        if(!c.createdAt) c.createdAt = Date.now();
        if(!c.type) c.type = 'single';
        if(!Array.isArray(c.members)) c.members = [];
        if(typeof c.bgImage !== 'string') c.bgImage = '';
        if(typeof c.unread !== 'number' || isNaN(c.unread) || c.unread < 0) c.unread = 0;
        if(typeof c.myAvatar !== 'string') c.myAvatar = '';
        if(!c.bubbleSettings || typeof c.bubbleSettings !== 'object') c.bubbleSettings = null;
        if(typeof c.blocked !== 'boolean') c.blocked = false;
        if(c.type === 'group'){
            if(!Array.isArray(c.admins)) c.admins = [];
            if(!c.mutedUntil || typeof c.mutedUntil !== 'object') c.mutedUntil = {};
            if(!c.groupAuto || typeof c.groupAuto !== 'object'){
                c.groupAuto = {enabled:false, minMinutes:5, maxMinutes:30, minCount:1, maxCount:3};
            }
        }
    });
    if(!data.wordCards || !Array.isArray(data.wordCards.groups)) data.wordCards = {groups:[]};
    data.wordCards.groups.forEach(g=>{
        if(!g.scope) g.scope = 'shared';
        if(typeof g.disabled !== 'boolean') g.disabled = false;
        if(!Array.isArray(g.cards)) g.cards = [];
        g.cards.forEach(c=>{ if(typeof c.disabled !== 'boolean') c.disabled = false; });
    });
    if(!data.clockCards || typeof data.clockCards !== 'object') data.clockCards = {place:[],action:[]};
    ['place','action'].forEach(k=>{
        if(!Array.isArray(data.clockCards[k])) data.clockCards[k] = [];
        data.clockCards[k].forEach(c=>{ if(!c.scope) c.scope = 'shared'; });
    });
    if(!Array.isArray(data.emojis)) data.emojis = [];
    if(!Array.isArray(data.textEmojis)) data.textEmojis = [];
    if(!Array.isArray(data.customStatuses) || !data.customStatuses.length) data.customStatuses = ['在线','忙碌','离线','隐身'];
    if(!data.replySettings) data.replySettings = defaultData().replySettings;
    if(!data.settings) data.settings = defaultData().settings;
    if(!data.theme) data.theme = defaultData().theme;
    if(typeof data.theme.homeBg !== 'string') data.theme.homeBg = '';
    if(typeof data.theme.homeCardOpacity !== 'number' || isNaN(data.theme.homeCardOpacity)) data.theme.homeCardOpacity = 0.72;
    if(!data.patSettings) data.patSettings = defaultData().patSettings;
    if(!data.music) data.music = defaultData().music;
    if(!data.letters) data.letters = defaultData().letters;
    if(!Array.isArray(data.letters.list)) data.letters.list = [];
    ensureLetterDailyReset();
}

function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function escAttr(s){return escapeHtml(s).replace(/"/g,'&quot;');}
function formatTime(ts){const d=new Date(ts);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function formatDateTime(ts){const d=new Date(ts);return (d.getMonth()+1)+'/'+d.getDate()+' '+formatTime(ts);}
function formatDate(ts){const d=new Date(ts);return String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0');}
function isToday(ts){const d=new Date(ts),n=new Date();return d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth()&&d.getDate()===n.getDate();}
function clamp(v,min,max){return Math.max(min,Math.min(max,v));}
function randInt(min,max){min=Math.round(Number(min));max=Math.round(Number(max));if(isNaN(min))min=1;if(isNaN(max))max=1;if(max<min){const t=min;min=max;max=t;}return min+Math.floor(Math.random()*(max-min+1));}
function fmtDuration(sec){const m=String(Math.floor(sec/60)).padStart(2,'0'),s=String(sec%60).padStart(2,'0');return m+':'+s;}
function fmtMusicTime(s){if(s==null||!isFinite(s)||s<0)return '00:00';return String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0');}
function getActiveContact(){if(!data||!data.activeContactId) return null;return data.contacts.find(c=>c.id===data.activeContactId)||null;}
function getContact(id){if(!data||!Array.isArray(data.contacts)) return null;return data.contacts.find(c=>c.id===id)||null;}
function isGroup(c){return c && c.type === 'group';}

function isStandaloneMode(){
    return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || (window.navigator && window.navigator.standalone === true);
}

function darkenHex(hex, amt){
    try{
        let h = String(hex||'').trim().replace('#','');
        if(h.length===3) h = h.split('').map(c=>c+c).join('');
        if(h.length!==6) return hex;
        const num = parseInt(h,16);
        if(isNaN(num)) return hex;
        let r=(num>>16)&255, g=(num>>8)&255, b=num&255;
        const f = 1 - Math.max(0, Math.min(1, amt||0));
        r=Math.round(r*f); g=Math.round(g*f); b=Math.round(b*f);
        return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
    }catch(e){ return hex; }
}

function showToast(msg,duration){
    duration = duration || 1800;
    const el = document.getElementById('toast');
    if(!el) return;
    el.textContent = msg; el.classList.remove('hide');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>el.classList.add('hide'),duration);
}

function getTotalUnread(){
    if(!Array.isArray(data.contacts)) return 0;
    return data.contacts.reduce((sum,c)=> sum + ((c && c.unread) ? c.unread : 0), 0);
}
function updateNavBadge(){
    const badge = document.getElementById('navChatBadge');
    if(!badge) return;
    const total = getTotalUnread();
    if(total > 0){ badge.textContent = total > 99 ? '99+' : String(total); badge.classList.add('show'); }
    else{ badge.classList.remove('show'); }
}

// ======================================================================
//  调度器
// ======================================================================
const scheduler = {
    tasks:[], seq:0,
    add(fn,delayMs,key){const id=++this.seq;this.tasks.push({id,key:key||null,time:Date.now()+Math.max(0,delayMs),fn});return id;},
    cancelByKey(key){this.tasks = this.tasks.filter(t=>t.key !== key);},
   tick(){
    const now = Date.now();
    const due = [];
    this.tasks = this.tasks.filter(t=>{ if(t.time<=now){due.push(t);return false;} return true;});
    if(due.length <= 5){
        due.forEach(t=>{try{t.fn();}catch(e){console.error(e);}});
    }else{
        due.slice(0,5).forEach(t=>{try{t.fn();}catch(e){console.error(e);}});
        due.slice(5).forEach((t,i)=>{
            setTimeout(()=>{try{t.fn();}catch(e){console.error(e);}}, 400*(i+1));
        });
    }
},
};
let _tickWorker = null;
let _mainTickStarted = false;
function startTickWorker(){
    if(!_mainTickStarted){
        _mainTickStarted = true;
        setInterval(()=>{ try{scheduler.tick();}catch(e){} }, 1000);
    }
    try{
        if(!_tickWorker && window.Worker){
            const code = 'let i=0;setInterval(function(){i=(i+1)%1e9;postMessage(i);},1000);';
            const blob = new Blob([code],{type:'application/javascript'});
            const url = URL.createObjectURL(blob);
            _tickWorker = new Worker(url);
            _tickWorker.onmessage = () => {
                try {
                    scheduler.tick();
                    const ctx = audioCtx;
                    if(ctx && ctx.state === 'suspended'){ ctx.resume().catch(()=>{}); }
                } catch(e){}
            };
            _tickWorker.onerror = () => {
                try{ _tickWorker.terminate(); }catch(e){}
                _tickWorker = null;
                setTimeout(()=>{ try{ startTickWorker(); }catch(e){} }, 3000);
            };
        }
    }catch(e){}
}

function ensureAudio(){
    if(!audioCtx){try{audioCtx = new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}
    if(audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
    return audioCtx;
}
function playNotifySound(force){
    if(!data.settings || !data.settings.soundEnabled) return;
    const now = Date.now(); if(!force && now-lastSoundTime<800) return;
    lastSoundTime = now;
    if(data.settings.soundCustom){try{const a=new Audio(data.settings.soundCustom);a.volume=0.85;a.play().catch(()=>{});return;}catch(e){}}
    const ctx = ensureAudio(); if(!ctx) return;
    const preset = data.settings.soundPreset || 'ding';
    let notes;
    if(preset==='pop') notes=[660];
    else if(preset==='bubble') notes=[523.25,659.25,783.99];
    else if(preset==='soft') notes=[440,554.37];
    else notes=[880,1174.66];
    const t0 = ctx.currentTime;
    notes.forEach((f,i)=>{try{const osc=ctx.createOscillator(),g=ctx.createGain();osc.type='sine';osc.frequency.value=f;osc.connect(g);g.connect(ctx.destination);const t=t0+i*0.11;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.28,t+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t+0.26);osc.start(t);osc.stop(t+0.3);}catch(e){}});
}
function playCallToneOnce(){
    const preset = data.settings.callSoundPreset || 'ring';
    const ctx = ensureAudio(); if(!ctx) return;
    const now = ctx.currentTime;
    let notes;
    if(preset==='pulse') notes=[523.25,659.25];
    else if(preset==='gentle') notes=[440,587.33];
    else if(preset==='urgent') notes=[880,880,1174.66];
    else notes=[880,1046.5];
    notes.forEach((f,i)=>{try{const osc=ctx.createOscillator(),g=ctx.createGain();osc.type='sine';osc.frequency.value=f;osc.connect(g);g.connect(ctx.destination);const t=now+i*0.18;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.3,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.32);osc.start(t);osc.stop(t+0.36);}catch(e){}});
}
function startRingTone(){
    if(ringToneTimer || ringToneAudio) return;
    if(!data.settings || data.settings.callSoundEnabled===false) return;
    if(data.settings.callCustom){try{ringToneAudio=new Audio(data.settings.callCustom);ringToneAudio.loop=true;ringToneAudio.volume=0.9;ringToneAudio.play().catch(()=>{ringToneAudio=null;});return;}catch(e){ringToneAudio=null;}}
    playCallToneOnce();
    ringToneTimer = setInterval(playCallToneOnce,1100);
}
function stopRingTone(){if(ringToneTimer){clearInterval(ringToneTimer);ringToneTimer=null;}if(ringToneAudio){try{ringToneAudio.pause();}catch(e){}ringToneAudio=null;}}
function unlockAudioOnce(){
    ensureAudio();
    if(data.settings && data.settings.keepAlive){
        startKeepAliveAudio();
    }
    document.removeEventListener('touchstart',unlockAudioOnce);
    document.removeEventListener('click',unlockAudioOnce);
}

function registerSWForNotifications(){
    if(!('serviceWorker' in navigator)) return;
    const doRegister = () => {
        // sw.js 不存在时静默失败，不影响其它功能
        navigator.serviceWorker.register('./sw.js', {scope:'./'}).then(reg => {
            console.log('[SW] 已注册', reg);
        }).catch(err => {
            console.warn('[SW] 注册失败（可忽略，通知会退化为普通 Notification）:', err);
        });
    };
    if(document.readyState === 'complete') doRegister();
    else window.addEventListener('load', doRegister, {once:true});

    try{
        navigator.serviceWorker.addEventListener('message', (e) => {
            const d = e.data || {};
            if(d.type === 'notification-click'){
                const cid = d.contactId;
                if(cid && getContact(cid)){ openChat(cid); }
                else { switchPage('contacts'); }
            }
        });
    }catch(e){}
}

function requestNotificationPermission(){
    if(!('Notification' in window)){showToast('当前环境不支持系统通知');return;}
    if(Notification.permission==='granted'){showToast('通知权限已开启 ✅');return;}
    if(Notification.permission==='denied'){showToast('通知被拒绝，请到浏览器设置中允许');return;}
    Notification.requestPermission().then(p=>{if(p==='granted'){showToast('通知权限已开启 ✅');}else showToast('通知权限被拒绝');}).catch(()=>{});
}

async function showSystemNotification(msg, force, contactId){
    if(!data.settings || !data.settings.notificationEnabled) return;
    if(!('Notification' in window)) return;
    if(Notification.permission !== 'granted') return;
    if(data.settings.notifyOnlyWhenHidden && !document.hidden && !force) return;

    let body = msg.content || '';
    if(msg.type==='emoji'||msg.type==='image') body='[图片]';
   else if(msg.type==='pat') body=(msg.content||'');
    else if(msg.type==='music') body=msg.content||'🎧 听歌邀请';
    if(body.length>120) body = body.slice(0,120)+'…';

    let contact = contactId ? getContact(contactId) : getActiveContact();
    const contactName = contact ? (contact.name || '新消息') : '新消息';
    const title = (contact && isGroup(contact) && msg.senderName)
        ? `${contactName} · ${msg.senderName}`
        : contactName;

    const options = {
        body,
             icon: 'icon.png',
        badge: 'icon.png',
        tag: 'lingdong-msg-' + Date.now(),
        data: { contactId: contactId || null },
        silent: false,
        requireInteraction: false,
        renotify: true,
        vibrate: [80,40,80]
    };

    // 优先走 Service Worker（有 sw.js 时后台也能弹）
    if('serviceWorker' in navigator){
        try{
           let reg = await navigator.serviceWorker.getRegistration();
if(!reg || typeof reg.showNotification !== 'function'){
    reg = await Promise.race([
        navigator.serviceWorker.ready,
        new Promise(resolve => setTimeout(() => resolve(null), 2000))
    ]);
}
            if(reg && typeof reg.showNotification === 'function'){
                await reg.showNotification(title, options);
                return;
            }
        }catch(e){}
    }
    // 退化为普通 Notification（桌面浏览器标签页也可用）
    try{
        const n = new Notification(title, options);
        n.onclick = function(){
            try{
                window.focus();
                if(contactId && getContact(contactId)) openChat(contactId);
                n.close();
            }catch(e){}
        };
    }catch(e){ console.warn('[通知] 推送失败', e); }
}

function requestNotifPermissionOnGesture(){

    _notifPermissionRequested = true;

}

function switchPage(page){
    const map = {contacts:'pageContacts',chat:'pageChat',chatinfo:'pageChatInfo',tools:'pageTools',settings:'pageSettings'};
    Object.values(map).forEach(id=>{const el=document.getElementById(id);if(el)el.classList.remove('active');});

    if(target) target.classList.add('active');

    if(page !== 'chat') closeEmojiPanel();
    const nav = document.getElementById('bottom-nav');
    if(nav) nav.style.display = (page === 'chat' || page === 'chatinfo') ? 'none' : '';

    if(page === 'chat'){renderHeader();renderMessagesNow();}
    if(page === 'chatinfo') renderChatInfo();
    if(page === 'tools'){switchToolTab('word');}

    const navMap = {contacts:'contacts',chat:'contacts',chatinfo:'contacts',tools:'tools',settings:'settings'};
    document.querySelectorAll('#bottom-nav .nav-item').forEach(item=>{item.classList.toggle('active', item.dataset.page === navMap[page]);});

    document.querySelectorAll('.tool-tabs .tab').forEach(t=>t.classList.toggle('active', t.dataset.tab === tab));

    document.getElementById('textEmojiTabContent').style.display = tab==='textEmoji' ? '' : 'none';

function getLastMessage(c){const msgs=c.messages||[];return msgs.length?msgs[msgs.length-1]:null;}
function previewOf(m,c){
    if(!m) return '';
    const prefix = (isGroup(c) && m.sender==='partner' && m.senderName) ? (m.senderName+': ') : '';
    if(m.type==='emoji'||m.type==='image') return prefix+'[图片]';
   if(m.type==='pat') return (m.content||'');
    if(m.type==='call') return m.content||'[通话]';
    if(m.type==='sys') return m.content||'';
    if(m.type==='recall') return m.content||'';
    return prefix+(m.content||'');
}
function renderContacts(){
    const body = document.getElementById('contactsBody');
    if(!body) return;
    if(!data.contacts.length){
        body.innerHTML = `<div class="empty-state" style="padding-top:80px;"><div class="empty-icon">👥</div><div>还没有联系人</div><div style="margin-top:6px;font-size:12px;">点击右上角 ＋ 添加联系人 / 发起群聊</div><button class="btn-primary" style="margin-top:16px;" onclick="showAddFriendModal()">＋ 添加联系人</button></div>`;
        updateNavBadge();
        return;
    }
    const list = [...data.contacts].sort((a,b)=>{
        const ta = getLastMessage(a) ? getLastMessage(a).timestamp : a.createdAt;
        const tb = getLastMessage(b) ? getLastMessage(b).timestamp : b.createdAt;
        return tb - ta;
    });
    let html = '';
    list.forEach(c=>{
        const last = getLastMessage(c);
        const timeStr = last ? (isToday(last.timestamp) ? formatTime(last.timestamp) : formatDate(last.timestamp)) : '';
        const online = c.status === '在线';
        const group = isGroup(c);
        const avatarInner = c.avatar ? `<img src="${c.avatar}" alt="">` : escapeHtml((c.name||'?')[0].toUpperCase());
        const unread = c.unread || 0;
        const unreadHtml = unread > 0 ? `<span class="contact-unread">${unread > 99 ? '99+' : unread}</span>` : '';
        const nameExtra = group ? `<span style="font-size:11px;color:var(--text-light);font-weight:400;">(${(c.members||[]).length})</span>` : '';
        html += `<div class="contact-item" data-id="${c.id}" onpointerdown="startLongPress(event,'${c.id}')" onpointerup="cancelLongPress()" onpointercancel="cancelLongPress()" onpointerleave="cancelLongPress()" onclick="openChatFromList('${c.id}')">
            <div class="contact-avatar">${avatarInner}${unreadHtml}</div>
            <div class="contact-main">
                <div class="contact-name"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(c.name)}</span>${nameExtra}<span class="status-dot ${online?'':'offline'}"></span></div>
                <div class="contact-preview">${escapeHtml(previewOf(last,c)) || '开始聊天吧'}</div>
            </div>
            <div class="contact-meta"><div class="contact-time">${timeStr}</div></div>
        </div>`;
    });
    body.innerHTML = html;
    updateNavBadge();
}
function startLongPress(e,id){
    cancelLongPress();
    longPressTimer = setTimeout(()=>{longPressTimer = null;suppressClick = true;setTimeout(()=>{suppressClick=false;},600);confirmDeleteContact(id);},650);
}
function cancelLongPress(){if(longPressTimer){clearTimeout(longPressTimer);longPressTimer=null;}}
function openChatFromList(id){if(suppressClick) return;openChat(id);}
function confirmDeleteContact(id){
    const c = getContact(id); if(!c) return;
    const label = isGroup(c) ? '群聊' : '好友';
    if(!confirm(`删除${label}「${c.name}」及其全部聊天记录？`)) return;
    data.contacts = data.contacts.filter(x=>x.id !== id);
    data.contacts.forEach(x=>{if(isGroup(x)) x.members = (x.members||[]).filter(m=>m!==id);});
    if(data.activeContactId === id) data.activeContactId = null;
    if(replyTimers[id]){clearTimeout(replyTimers[id]);delete replyTimers[id];}
    data.wordCards.groups = data.wordCards.groups.filter(g => !(g.scope==='private' && g.ownerId===id));
    ['place','action'].forEach(k=>{data.clockCards[k] = data.clockCards[k].filter(c=>!(c.scope==='private' && c.ownerId===id));});
    if(data.letters && Array.isArray(data.letters.list)){
        data.letters.list = data.letters.list.filter(l=>l.contactId !== id);
    }
    scheduler.cancelByKey('groupAuto_'+id);
    scheduler.cancelByKey('autoMsg_'+id);
    typingContacts.delete(id);
    saveData(true); renderContacts(); updateNavBadge(); showToast('已删除');
}

function avatarHtmlFor(sender, senderId, senderName){
        if(sender === 'me'){
        const u = data.user;
        const c = getActiveContact();
        const myAv = (c && c.myAvatar) ? c.myAvatar : (u.avatar || '');
        if(myAv) return `<img src="${escapeHtml(myAv)}" alt="">`;
        return escapeHtml(((u.name||'我')[0]).toUpperCase());
    }
    const c = getActiveContact();
    if(!c) return '?';

    if(isGroup(c)){
        if(senderId){
            const m = getContact(senderId);
            if(m){
                if(m.avatar) return `<img src="${escapeHtml(m.avatar)}" alt="">`;
                return escapeHtml(((m.name||'?')[0].toUpperCase()));
            }
        }
        if(senderName){
            const m = (c.members||[]).map(id=>getContact(id)).find(x=>x && x.name===senderName);
            if(m){
                if(m.avatar) return `<img src="${escapeHtml(m.avatar)}" alt="">`;
                return escapeHtml(((m.name||'?')[0].toUpperCase()));
            }
        }
        const members = (c.members||[]).map(id=>getContact(id)).filter(Boolean);
        if(members.length){
            const m = members[0];
            if(m.avatar) return `<img src="${escapeHtml(m.avatar)}" alt="">`;
            return escapeHtml(((m.name||'?')[0].toUpperCase()));
        }
        return '?';
    }

    if(c.avatar) return `<img src="${escapeHtml(c.avatar)}" alt="">`;
    return escapeHtml(((c.name||'?')[0].toUpperCase()));
}

    }

         /* ===== 引用消息：可点击跳转到被引用的原消息 ===== */

function jumpToMessage(e, refId){
    if(e){ e.stopPropagation(); e.preventDefault(); }
    const c = getActiveContact(); if(!c) return;
    const msgs = c.messages || [];
    const idx = msgs.findIndex(m=>m.id===refId);
    if(idx < 0){ showToast('引用的消息已不存在'); return; }

    let el = document.querySelector(`#message-area [data-id="${refId}"]`);
    if(!el){
        // 目标消息不在当前渲染窗口内 → 重新渲染包含它的片段
        _msgRenderStart = Math.max(0, idx - 15);
        renderMessagesNow();
        _msgRenderStart = null;
        el = document.querySelector(`#message-area [data-id="${refId}"]`);
    }
    if(!el){ showToast('找不到该消息'); return; }

    const area = document.getElementById('message-area');
    if(area){
        requestAnimationFrame(()=>{
            const areaRect = area.getBoundingClientRect();
            const elRect = el.getBoundingClientRect();
            const targetTop = area.scrollTop + (elRect.top - areaRect.top) - (area.clientHeight - elRect.height) / 2;
            const top = Math.max(0, targetTop);
            if(area.scrollTo) area.scrollTo({ top, behavior: 'smooth' });
            else area.scrollTop = top;
        });
    }
    el.classList.add('msg-highlight');
    setTimeout(()=>el.classList.remove('msg-highlight'), 1700);
}

function toggleRecallMessage(el, msgId){
    const c = getActiveContact(); if(!c) return;

function addMessage(sender,content,type,replyTo,silent,isAuto,senderName,contactId,senderId,extra){
    let c;
    if(contactId){
        c = getContact(contactId);
        if(!c){ console.warn('[addMessage] 联系人不存在:', contactId); return null; }
    }else{
        c = getActiveContact();
        if(!c) return null;
    }

    const msgType = type || 'text';
    if(sender === 'partner' && c.blocked) return null;

    if(sender === 'partner' && isGroup(c) && (msgType === 'text' || msgType === 'emoji' || msgType === 'image')){
        let targetMember = null;
        if(senderId){
            const m = getContact(senderId);
            if(m && (c.members||[]).includes(senderId)) {
                targetMember = m;
            }
        }
        if(!targetMember){
            const now = Date.now();
            let validMembers = (c.members||[]).map(id=>getContact(id)).filter(m => m && !(c.mutedUntil && c.mutedUntil[m.id] && c.mutedUntil[m.id] > now));
            if(!validMembers.length){
                validMembers = (c.members||[]).map(id=>getContact(id)).filter(Boolean);
            }
            if(validMembers.length){
                targetMember = validMembers[Math.floor(Math.random()*validMembers.length)];
            }
        }
        if(targetMember){
            senderId = targetMember.id;
            senderName = targetMember.name;
        } else {
            return null;
        }
    }

    const msg = {id:genId(),sender,content,timestamp:Date.now(),type:msgType,replyTo:replyTo||null,isAuto:!!isAuto,senderName:senderName||'',senderId:senderId||''};
    if(extra && typeof extra==='object') Object.assign(msg, extra);
    const isActive = (data.activeContactId === c.id) && isChatPageVisible();
    const wasNearBottom = isActive && isNearBottom(150);
    c.messages.push(msg);
    if(c.messages.length > 1500) c.messages = c.messages.slice(-1500);
    if(sender === 'partner' && !isActive){ c.unread = (c.unread || 0) + 1; }

    saveData(true);

    if(sender === 'partner' && !isActive){ updateNavBadge(); }
    if(isActive){
        appendMessageToDOM(msg);
        if(sender === 'me' || wasNearBottom) requestAnimationFrame(scrollToBottomImmediate);
    }else{
        const contactsPage = document.getElementById('pageContacts');
        if(contactsPage && contactsPage.classList.contains('active')) renderContacts();
    }

    if(sender === 'partner' && !silent){
        playNotifySound();
        showSystemNotification(msg, false, c.id);
        try{if(navigator.vibrate)navigator.vibrate([80,40,80]);}catch(e){}
    }
    if(sender === 'partner' && !silent && (msg.type==='text'||msg.type==='emoji'||msg.type==='image')) schedulePartnerRecall(msg.id, c.id);
    return msg;
}

function recallMyMessage(msgId){
    const c = getActiveContact(); if(!c) return;
    const idx = (c.messages||[]).findIndex(m=>m.id===msgId);
    if(idx < 0) return;
    const m = c.messages[idx];
    if(!m || m.sender !== 'me') return;
    if(m.type !== 'text' && m.type !== 'emoji' && m.type !== 'image'){
        showToast('该消息不支持撤回');
        return;
    }
    const elapsed = Date.now() - m.timestamp;
    if(elapsed > RECALL_WINDOW_MS){
        showToast('超过 5 分钟，无法撤回');
        return;
    }
    if(!confirm('确定撤回这条消息吗？')) return;

    const recalledType = m.type;
    const recalledContent = m.content || '';
    const displayName = data.user.name || '我';

    c.messages.splice(idx, 1);
    saveData(true);
    const el = document.querySelector(`.msg-group[data-id="${msgId}"]`);
    if(el) el.remove();

    addMessage('me', `${displayName} 撤回了一条消息`, 'recall', null, true, false, '', c.id, null, {
        recalledContent: recalledContent,
        recalledType: recalledType,
        recalledSenderName: displayName,
        recalledSenderId: ''
    });
    showToast('已撤回');
}
